version: v2

# Generates one combined Markdown document covering every package in
# the query-side proto tree. Output lives at
# docs/proto/query-server.md and is committed — task gen:check
# enforces freshness.

inputs:
  - directory: api/proto
    paths:
      - api/proto/query

plugins:
  - local: [go, tool, protoc-gen-doc]
    out: docs/proto
    strategy: all
    opt: markdown,query-server.md
