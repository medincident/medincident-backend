version: v2

# Generates one combined Markdown document covering every package in
# the api/proto tree (event + command + query). Output lives at
# docs/api/Proto.md and is committed — task gen:check enforces
# freshness.

inputs:
  - directory: api/proto

plugins:
  - local: [go, tool, protoc-gen-doc]
    out: docs/api
    strategy: all
    opt: markdown,Proto.md
