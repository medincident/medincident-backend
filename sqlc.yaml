version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/storage/postgres/sqlc/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/storage/postgres/sqlc/gen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: false
        emit_exported_queries: false
        emit_pointers_for_null_types: true
