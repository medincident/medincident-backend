version: "3"

tasks:
  gen:
    desc: Generate Go code, OpenAPI spec, and combined Markdown docs from proto
    cmds:
      - go tool buf generate
      - go tool buf generate --template buf.gen.docs.yaml
      # Normalize whitespace in generated docs so pre-commit hooks
      # (trailing-whitespace, end-of-file-fixer) don't cause drift
      # between `task gen:check` and the committed file.
      - |
        set -e
        find docs/proto -name '*.md' | while read -r f; do
          awk '
            { sub(/[ \t\r]+$/, "") }
            /^$/ { blank++; next }
            { for (i = 0; i < blank; i++) print ""; blank = 0; print }
          ' "$f" > "$f.tmp"
          # Guarantee exactly one trailing newline.
          printf "%s\n" "$(cat "$f.tmp")" > "$f"
          rm -f "$f.tmp"
        done

  gen:check:
    desc: Verify generated artifacts are up to date (fails if `task gen` would produce changes)
    cmds:
      - task: gen
      - git diff --exit-code -- pkg/ api/openapi/ docs/proto/

  proto:fmt:
    desc: Format proto files in api/proto
    cmds:
      - go tool buf format -w api/proto

  proto:fmt:check:
    desc: Verify proto files are formatted (fails if `task proto:fmt` would produce changes)
    cmds:
      - go tool buf format -d --exit-code api/proto

  proto:lint:
    desc: Lint proto files
    cmds:
      - go tool buf lint api/proto

  proto:breaking:
    desc: Check for breaking proto changes vs main (skips gracefully if main has no protos)
    cmds:
      - |
        if git show origin/main:api/proto/buf.yaml >/dev/null 2>&1; then
          go tool buf breaking api/proto --against '.git#branch=origin/main,subdir=api/proto'
        elif git show main:api/proto/buf.yaml >/dev/null 2>&1; then
          go tool buf breaking api/proto --against '.git#branch=main,subdir=api/proto'
        else
          echo "Skipping breaking check: main branch has no api/proto/"
        fi

  lint:
    desc: Lint Go code
    cmds:
      - go tool golangci-lint run

  fmt:
    desc: Format Go code via golangci-lint formatters
    cmds:
      - go tool golangci-lint fmt

  fmt:check:
    desc: Verify Go formatting (dry-run, no file changes)
    cmds:
      - go tool golangci-lint fmt --diff

  test:unit:
    desc: Run unit tests only
    cmds:
      - go test -race -count=1 ./...

  test:integration:
    desc: Run integration tests (requires Docker)
    cmds:
      - go test -tags=integration -count=1 -timeout=10m -v ./test/integration/...

  test:
    desc: Run the full test suite (unit + integration)
    cmds:
      - task: test:unit
      - task: test:integration

  vuln:
    desc: Run Go vulnerability check
    cmds:
      - go tool govulncheck ./...

  migrate:
    desc: Apply dbmate migrations (requires DATABASE_URL in env or .env)
    cmds:
      - go tool dbmate up

  migrate:new:
    desc: "Create a new dbmate migration. Usage: task migrate:new -- <name>"
    cmds:
      - go tool dbmate new {{.CLI_ARGS}}
