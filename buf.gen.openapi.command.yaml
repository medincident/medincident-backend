version: v2

# Generates a single merged OpenAPI v2 spec from the command-side proto
# tree under api/proto/command. Output lives at
# api/openapi/command-server.swagger.json.

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/medincident/medincident-command-service/pkg
  disable:
    - file_option: go_package_prefix
      module: buf.build/googleapis/googleapis
    - file_option: go_package_prefix
      module: buf.build/grpc-ecosystem/grpc-gateway
    - file_option: go_package_prefix
      module: buf.build/protocolbuffers/wellknowntypes

inputs:
  - directory: api/proto
    paths:
      - api/proto/command

plugins:
  - local: [go, tool, protoc-gen-openapiv2]
    out: api/openapi
    strategy: all
    opt:
      - allow_merge=true
      - merge_file_name=command-server
