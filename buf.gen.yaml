version: v2

# Generates Go client + server gRPC stubs, HTTP gateway stubs, and a
# single merged OpenAPI v2 spec from the local proto module at api/proto.
#
# Go package paths are injected by managed mode via go_package_prefix —
# no `option go_package` lives in any .proto file. External modules
# (googleapis, grpc-gateway, wellknowntypes) keep their upstream Go
# import paths and are explicitly excluded from the override.

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/medincident/medincident-command-service/pkg
  disable:
    - file_option: go_package_prefix
      module: buf.build/googleapis/googleapis
    - file_option: go_package_prefix
      module: buf.build/grpc-ecosystem/grpc-gateway
    - file_option: go_package_prefix
      module: buf.build/protocolbuffers/wellknowntypes

inputs:
  - directory: api/proto

plugins:
  - local: [go, tool, protoc-gen-go]
    out: pkg
    opt:
      - paths=source_relative

  - local: [go, tool, protoc-gen-go-grpc]
    out: pkg
    opt:
      - paths=source_relative

  - local: [go, tool, protoc-gen-grpc-gateway]
    out: pkg
    opt:
      - paths=source_relative

  - local: [go, tool, protoc-gen-openapiv2]
    out: api/openapi
    strategy: all
    opt:
      - allow_merge=true
      - merge_file_name=command-server
