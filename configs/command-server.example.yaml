# command-server — example configuration.
#
# Loaded by cmd/command-server/main.go via readConfig (in that package).
# ${VAR} and $VAR references are expanded from the process environment
# before YAML parsing, so secrets should be injected via env rather
# than hard-coded.

server:
  grpc:
    # TCP listen address for the gRPC server. All three binaries in this
    # repo default to :8080 inside their containers; the operator maps
    # external ports at deploy time (Docker `-p`, k8s Service, ingress).
    # For local multi-binary runs, override here (e.g. ":9090").
    address: ":8080"
    # Maximum inbound message size in bytes. Covers a single request.
    max_recv_msg_size: 4194304  # 4 MiB

postgres:
  # libpq-style DSN, normally injected via env: dsn: ${DATABASE_URL}.
  # The command-server opens the database via pgxpool, so pool tuning
  # lives in the DSN query string (defaults in parens — see pgxpool docs):
  #   - pool_max_conns                 (default: max(4, NumCPU))
  #   - pool_min_conns                 (default: 0)
  #   - pool_max_conn_lifetime         (default: 1h)
  #   - pool_max_conn_idle_time        (default: 30m)
  #   - pool_health_check_period       (default: 1m)
  #   - pool_max_conn_lifetime_jitter  (default: 0)
  # Example tuned DSN:
  #   postgres://user:pass@host:5432/db?sslmode=disable&pool_max_conns=20&pool_max_conn_lifetime=30m&pool_max_conn_idle_time=5m
  dsn: "postgres://postgres:postgres@localhost:5432/medincident?sslmode=disable"

zerolog:
  level: info
  timestamp: true
  time_format: "2006-01-02T15:04:05Z07:00"
  outputs:
    - type: console
      target: stdout
      pretty: true
      time_format: "15:04:05"
      parts_order: ["time", "level", "caller", "message"]

# Zitadel — identity provider. Two separate key files are required because
# Zitadel distinguishes OAuth Applications (introspection clients) from
# Service Users (Management API callers) — a single identity cannot serve
# both roles.
#
#   introspection_key_path — key.json downloaded from a Zitadel Application
#     (project → Application → Keys). The Application must be an API-type
#     app registered in the same Zitadel project. Used by the authn
#     interceptor to verify every inbound Bearer token.
#
#   management_key_path — key.json downloaded from a Zitadel Service User
#     (Users → Service Users → <user> → Keys). The Service User must hold
#     the ORG_USER_MANAGER or IAM_USER_MANAGER role. Used by EmployeeService
#     to verify that a Zitadel user exists before hiring.
zitadel:
  domain: "${ZITADEL_DOMAIN}"
  introspection_key_path: "${ZITADEL_INTROSPECTION_KEY_PATH}"  # Application key
  management_key_path: "${ZITADEL_MANAGEMENT_KEY_PATH}"        # Service User key

# Garage — S3-compatible object storage. Optional: remove the entire
# block to disable S3 wiring. When present, every field is validated.
# Used for file attachments, media uploads, and other binary objects.
# Garage requires path-style addressing; the SDK client is configured
# accordingly.
garage:
  endpoint: "${GARAGE_ENDPOINT}"                 # e.g. http://localhost:3900
  access_key_id: "${GARAGE_ACCESS_KEY_ID}"
  secret_access_key: "${GARAGE_SECRET_ACCESS_KEY}"
  region: "garage"                               # Garage ignores region but the SDK requires one
  bucket: "medincident"
