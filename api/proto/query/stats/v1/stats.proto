syntax = "proto3";

package query.stats.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ValidationErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"validation_failed\",\"message\":\"Validation failed.\",\"details\":{\"violations\":[{\"field\":\"field_name\",\"rule\":\"required\",\"message\":\"field is required\"}]}}"
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unauthenticated\",\"message\":\"unauthenticated\"}"
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"permission_denied\",\"message\":\"permission denied\"}"
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unexpected_error\",\"message\":\"internal error\"}"
      }
    }
  }
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response (e.g. deadline exceeded or request canceled)."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"deadline_exceeded\",\"message\":\"deadline exceeded\"}"
      }
    }
  }
};

// StatsQueryService exposes aggregate counters for dashboards. Counts
// come from the per-aggregate counters tables; "employees on vacation"
// and "scheduled vacations" are computed at read time from
// projections.employee_vacations so they never drift.
service StatsQueryService {
  rpc GetOrganizationStats(GetOrganizationStatsRequest) returns (GetOrganizationStatsResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/stats"};
  }
  rpc GetClinicStats(GetClinicStatsRequest) returns (GetClinicStatsResponse) {
    option (google.api.http) = {get: "/v1/clinics/{clinic_id}/stats"};
  }
  rpc GetDepartmentStats(GetDepartmentStatsRequest) returns (GetDepartmentStatsResponse) {
    option (google.api.http) = {get: "/v1/departments/{department_id}/stats"};
  }
}

message OrganizationStats {
  string organization_id = 1;
  int64 employees_total = 2;
  int64 clinics_total = 3;
  int64 departments_total = 4;
  int64 employees_on_vacation = 5;
  int64 vacations_scheduled = 6;
}

message ClinicStats {
  string clinic_id = 1;
  string organization_id = 2;
  int64 employees_total = 3;
  int64 departments_total = 4;
  int64 employees_on_vacation = 5;
}

message DepartmentStats {
  string department_id = 1;
  optional string clinic_id = 2;
  string organization_id = 3;
  int64 employees_total = 4;
  int64 employees_on_vacation = 5;
}

message GetOrganizationStatsRequest {
  string organization_id = 1;
}
message GetOrganizationStatsResponse {
  OrganizationStats stats = 1;
}

message GetClinicStatsRequest {
  string clinic_id = 1;
}
message GetClinicStatsResponse {
  ClinicStats stats = 1;
}

message GetDepartmentStatsRequest {
  string department_id = 1;
}
message GetDepartmentStatsResponse {
  DepartmentStats stats = 1;
}
