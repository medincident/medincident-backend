syntax = "proto3";

package query.announcement.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/medincident/medincident-backend/pkg/query/announcement/v1;announcementqueryv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
};

// AnnouncementQueryService is the read-side contract for announcements.
// GetAnnouncement increments the view counter on each call.
service AnnouncementQueryService {
  rpc GetAnnouncement(GetAnnouncementRequest) returns (GetAnnouncementResponse) {
    option (google.api.http) = {get: "/v1/query/announcements/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `announcement_query_not_found` — announcement with the given ID does not exist."}
      }
    };
  }
  rpc ListAnnouncementsForOrganization(ListAnnouncementsForOrganizationRequest) returns (ListAnnouncementsForOrganizationResponse) {
    option (google.api.http) = {get: "/v1/query/organizations/{organization_id}/announcements"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "400"
        value: {description: "Validation failed. Error codes:\n- `announcement_query_bad_cursor` — pagination cursor is invalid or malformed."}
      }
    };
  }
  rpc ListAnnouncementsForClinic(ListAnnouncementsForClinicRequest) returns (ListAnnouncementsForClinicResponse) {
    option (google.api.http) = {get: "/v1/query/clinics/{clinic_id}/announcements"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "400"
        value: {description: "Validation failed. Error codes:\n- `announcement_query_bad_cursor` — pagination cursor is invalid or malformed."}
      }
    };
  }
  rpc ListAnnouncementsForDepartment(ListAnnouncementsForDepartmentRequest) returns (ListAnnouncementsForDepartmentResponse) {
    option (google.api.http) = {get: "/v1/query/departments/{department_id}/announcements"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "400"
        value: {description: "Validation failed. Error codes:\n- `announcement_query_bad_cursor` — pagination cursor is invalid or malformed."}
      }
    };
  }
}

enum AnnouncementPriority {
  ANNOUNCEMENT_PRIORITY_UNSPECIFIED = 0;
  ANNOUNCEMENT_PRIORITY_NORMAL = 1;
  ANNOUNCEMENT_PRIORITY_HIGH = 2;
}

message AnnouncementView {
  string id = 1;
  string organization_id = 2;
  optional string clinic_id = 3;
  optional string department_id = 4;
  string author_id = 5;
  string title = 6;
  string content = 7;
  AnnouncementPriority priority = 8;
  bool is_archived = 9;
  optional string starts_at = 10; // RFC3339Nano
  optional string ends_at = 11; // RFC3339Nano
  string created_at = 12; // RFC3339Nano
  string updated_at = 13; // RFC3339Nano
  int64 view_count = 14;
}

message GetAnnouncementRequest {
  string id = 1;
}

message GetAnnouncementResponse {
  AnnouncementView announcement = 1;
}

message ListAnnouncementsForOrganizationRequest {
  string organization_id = 1;
  bool include_archived = 2;
  AnnouncementPriority priority = 3; // UNSPECIFIED = all
  int32 limit = 4;
  optional string cursor = 5;
}

message ListAnnouncementsForOrganizationResponse {
  repeated AnnouncementView items = 1;
  optional string next_cursor = 2;
}

message ListAnnouncementsForClinicRequest {
  string clinic_id = 1;
  bool include_archived = 2;
  AnnouncementPriority priority = 3;
  int32 limit = 4;
  optional string cursor = 5;
}

message ListAnnouncementsForClinicResponse {
  repeated AnnouncementView items = 1;
  optional string next_cursor = 2;
}

message ListAnnouncementsForDepartmentRequest {
  string department_id = 1;
  bool include_archived = 2;
  AnnouncementPriority priority = 3;
  int32 limit = 4;
  optional string cursor = 5;
}

message ListAnnouncementsForDepartmentResponse {
  repeated AnnouncementView items = 1;
  optional string next_cursor = 2;
}
