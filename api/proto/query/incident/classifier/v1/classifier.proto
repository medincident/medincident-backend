syntax = "proto3";

package query.incident.classifier.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ValidationErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"validation_failed\",\"message\":\"Validation failed.\",\"details\":{\"violations\":[{\"field\":\"field_name\",\"rule\":\"required\",\"message\":\"field is required\"}]}}"
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unauthenticated\",\"message\":\"unauthenticated\"}"
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"permission_denied\",\"message\":\"permission denied\"}"
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unexpected_error\",\"message\":\"internal error\"}"
      }
    }
  }
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response (e.g. deadline exceeded or request canceled)."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"deadline_exceeded\",\"message\":\"deadline exceeded\"}"
      }
    }
  }
};

// IncidentClassifierQueryService exposes read methods over the
// projections.incident_categories / projections.incident_types
// tables. Subtree walks (descendants of a category) use recursive SQL
// CTEs in the reader; the RPC surface stays flat.
service IncidentClassifierQueryService {
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse) {
    option (google.api.http) = {get: "/v1/incident-categories/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_not_found\",\"message\":\"Category not found.\"}"
          }
        }
      }
    };
  }
  rpc ListCategoriesByOrganization(ListCategoriesByOrganizationRequest) returns (ListCategoriesByOrganizationResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/incident-categories"};
  }
  rpc ListActiveRootCategories(ListActiveRootCategoriesRequest) returns (ListActiveRootCategoriesResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/incident-categories:roots"};
  }
  rpc ListCategorySubtree(ListCategorySubtreeRequest) returns (ListCategorySubtreeResponse) {
    option (google.api.http) = {get: "/v1/incident-categories/{root_category_id}:subtree"};
  }

  rpc GetType(GetTypeRequest) returns (GetTypeResponse) {
    option (google.api.http) = {get: "/v1/incident-types/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_not_found\",\"message\":\"Type not found.\"}"
          }
        }
      }
    };
  }
  rpc ListTypesByCategory(ListTypesByCategoryRequest) returns (ListTypesByCategoryResponse) {
    option (google.api.http) = {get: "/v1/incident-categories/{category_id}/types"};
  }
  rpc ListActiveTypesByOrganization(ListActiveTypesByOrganizationRequest) returns (ListActiveTypesByOrganizationResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/incident-types:active"};
  }

  // Patient-facing reads. These are scoped to one organisation and return
  // only the slice of the classifier that a patient may see when filing
  // an incident.
  rpc ListPatientAllowedTypesByOrganization(ListPatientAllowedTypesByOrganizationRequest) returns (ListPatientAllowedTypesByOrganizationResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/incident-types:patient-allowed"};
  }
  rpc ListPatientVisibleCategoriesByOrganization(ListPatientVisibleCategoriesByOrganizationRequest) returns (ListPatientVisibleCategoriesByOrganizationResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/incident-categories:patient-visible"};
  }
}

// Category mirrors projections.incident_categories row.
message Category {
  string id = 1;
  string organization_id = 2;
  optional string parent_category_id = 3;
  string name = 4;
  optional string description = 5;
  bool is_active = 6;
  string created_at = 7;
  string updated_at = 8;
}

// Type mirrors projections.incident_types row.
message Type {
  string id = 1;
  string organization_id = 2;
  string category_id = 3;
  string name = 4;
  optional string description = 5;
  bool is_active = 6;
  string created_at = 7;
  string updated_at = 8;
  bool is_allowed_for_patients = 9;
}

message GetCategoryRequest {
  string id = 1;
}
message GetCategoryResponse {
  Category category = 1;
}

message ListCategoriesByOrganizationRequest {
  string organization_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListCategoriesByOrganizationResponse {
  repeated Category items = 1;
}

message ListActiveRootCategoriesRequest {
  string organization_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListActiveRootCategoriesResponse {
  repeated Category items = 1;
}

message ListCategorySubtreeRequest {
  string root_category_id = 1;
}
message ListCategorySubtreeResponse {
  repeated Category items = 1;
}

message GetTypeRequest {
  string id = 1;
}
message GetTypeResponse {
  Type type = 1;
}

message ListTypesByCategoryRequest {
  string category_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListTypesByCategoryResponse {
  repeated Type items = 1;
}

message ListActiveTypesByOrganizationRequest {
  string organization_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListActiveTypesByOrganizationResponse {
  repeated Type items = 1;
}

message ListPatientAllowedTypesByOrganizationRequest {
  string organization_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListPatientAllowedTypesByOrganizationResponse {
  repeated Type items = 1;
}

message ListPatientVisibleCategoriesByOrganizationRequest {
  string organization_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListPatientVisibleCategoriesByOrganizationResponse {
  repeated Category items = 1;
}
