syntax = "proto3";

package query.request.classifier.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/medincident/medincident-backend/pkg/query/request/classifier/v1;requestclassifierqueryv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
};

service RequestClassifierQueryService {
  rpc GetRequestType(GetRequestTypeRequest) returns (GetRequestTypeResponse) {
    option (google.api.http) = {get: "/v1/request-types/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `request_type_not_found` — request type with the given ID does not exist."}
      }
    };
  }
  rpc ListRequestTypesByOrganization(ListRequestTypesByOrganizationRequest) returns (ListRequestTypesByOrganizationResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/request-types"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "400"
        value: {description: "Validation failed. Error codes:\n- `request_classifier_bad_cursor` — pagination cursor is invalid or malformed."}
      }
    };
  }
  rpc ListActiveRequestTypesByOrganization(ListActiveRequestTypesByOrganizationRequest) returns (ListActiveRequestTypesByOrganizationResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/request-types:active"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "400"
        value: {description: "Validation failed. Error codes:\n- `request_classifier_bad_cursor` — pagination cursor is invalid or malformed."}
      }
    };
  }
}

message RequestType {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  optional string description = 4;
  bool is_active = 5;
  string created_at = 6;
  string updated_at = 7;
}

message GetRequestTypeRequest {
  string id = 1;
}
message GetRequestTypeResponse {
  RequestType request_type = 1;
}

message ListRequestTypesByOrganizationRequest {
  string organization_id = 1;
  int32 limit = 2;
  string after = 3;
}
message ListRequestTypesByOrganizationResponse {
  repeated RequestType items = 1;
  optional string next_cursor = 2;
}

message ListActiveRequestTypesByOrganizationRequest {
  string organization_id = 1;
  int32 limit = 2;
  string after = 3;
}
message ListActiveRequestTypesByOrganizationResponse {
  repeated RequestType items = 1;
  optional string next_cursor = 2;
}
