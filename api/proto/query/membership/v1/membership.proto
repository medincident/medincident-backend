    option (google.api.http) = {get: "/v1/employees/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `employee_card_not_found` — employee with the given ID does not exist."}
      }
    };
  }
  rpc GetMyEmployee(GetMyEmployeeRequest) returns (GetMyEmployeeResponse) {
    option (google.api.http) = {get: "/v1/employees/me"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `employee_card_not_found` — the authenticated user has no employee record."}
      }
    };
  }
  rpc ListEmployeesByDepartment(ListEmployeesByDepartmentRequest) returns (ListEmployeesByDepartmentResponse) {
    option (google.api.http) = {get: "/v1/departments/{department_id}/employees"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "400"
        value: {description: "Validation failed. Error codes:\n- `membership_bad_cursor` — pagination cursor is invalid or malformed."}
      }
    };
  }
  rpc ListEmployeesByClinic(ListEmployeesByClinicRequest) returns (ListEmployeesByClinicResponse) {
    option (google.api.http) = {get: "/v1/clinics/{clinic_id}/employees"};
