// EmployeeCardView is the denormalised card projection returned by
// both Get and List endpoints. Fields mirror projections.employee_cards
// columns; timestamps are RFC3339 strings. Optional fields stay unset
// when the backing column is NULL.
message EmployeeCardView {
  string employee_id = 1;
  string zitadel_user_id = 2;
  optional string first_name = 3;
  optional string last_name = 4;
  optional string display_name = 5;
  optional string email = 6;
  string organization_id = 7;
  optional string organization_name = 8;
  optional string clinic_id = 9;
  optional string clinic_name = 10;
  string department_id = 11;
  optional string department_name = 12;
  optional string position = 13;
  optional string terminated_at = 14;
  optional string current_vacation_ends_at = 15;
  optional string next_vacation_starts_at = 16;
}

// VacationView mirrors projections.employee_vacations. state is one of
// {scheduled, active, ended, cancelled}.
message VacationView {
  string id = 1;
  string employee_id = 2;
  string state = 3;
  string starts_at = 4;
  optional string ends_at = 5;
  string created_at = 6;
  string updated_at = 7;
}

// RoleAssignment is a role row enriched with the denormalised card for
// the holder and, when present, the deputy. Read-model callers use
// this so they do not need to follow role lookups with N+1 GetEmployee
// calls to render a name or email.
message RoleAssignment {
  EmployeeCardView holder = 1;
  optional EmployeeCardView deputy = 2;
}

// SystemAdminView is the system-admin role; system admins are rooted in
// Zitadel user ids, not employee ids.
message SystemAdminView {
  string zitadel_user_id = 1;
  string created_at = 2;
}

message GetEmployeeRequest {
  string id = 1;
}
message GetEmployeeResponse {
  EmployeeCardView employee = 1;
}

message GetMyEmployeeRequest {}
message GetMyEmployeeResponse {
  EmployeeCardView employee = 1;
}

message ListEmployeesByDepartmentRequest {
  string department_id = 1;
  int32 limit = 2;
  string after = 3;
  // When false (default), rows with terminated_at IS NOT NULL are
  // hidden. Set true to include offboarded employees.
  bool include_terminated = 4;
  // When true, restrict to employees currently on an active vacation
  // (current_vacation_ends_at IS NOT NULL AND > now()).
  bool on_vacation = 5;
  // Optional exact-match filter on employee_cards.position. Trimmed
  // before comparison; all-whitespace is treated as unset.
  optional string position = 6;
}
message ListEmployeesByDepartmentResponse {
  repeated EmployeeCardView items = 1;
  optional string next_cursor = 2;
}

message ListEmployeesByClinicRequest {
  string clinic_id = 1;
  int32 limit = 2;
  string after = 3;
  // When false (default), rows with terminated_at IS NOT NULL are
  // hidden. Set true to include offboarded employees.
  bool include_terminated = 4;
  // When true, restrict to employees currently on an active vacation
  // (current_vacation_ends_at IS NOT NULL AND > now()).
  bool on_vacation = 5;
  // Optional exact-match filter on employee_cards.position. Trimmed
  // before comparison; all-whitespace is treated as unset.
  optional string position = 6;
}
message ListEmployeesByClinicResponse {
