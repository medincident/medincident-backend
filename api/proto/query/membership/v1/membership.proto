message ListOrgHeadsRequest {
  string organization_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListOrgHeadsResponse {
  repeated RoleAssignment items = 1;
}

message ListSystemAdminsRequest {
  int32 limit = 1;
  int32 offset = 2;
}
message ListSystemAdminsResponse {
  repeated SystemAdminView items = 1;
}
