  rpc ListEmployeesByOrganization(ListEmployeesByOrganizationRequest) returns (ListEmployeesByOrganizationResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/employees"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
