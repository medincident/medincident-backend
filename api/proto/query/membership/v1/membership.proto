syntax = "proto3";

package query.membership.v1;

import "google/api/annotations.proto";

// MembershipQueryService exposes read methods over the employee
// projections and the role assignment projections (clinic heads,
// department responsibles, org admins/heads/dispatchers, system admins).
service MembershipQueryService {
  rpc GetEmployee(GetEmployeeRequest) returns (GetEmployeeResponse) {
    option (google.api.http) = {get: "/v1/employees/{id}"};
  }
  rpc ListEmployeesByDepartment(ListEmployeesByDepartmentRequest) returns (ListEmployeesByDepartmentResponse) {
    option (google.api.http) = {get: "/v1/departments/{department_id}/employees"};
  }
  rpc ListEmployeesByClinic(ListEmployeesByClinicRequest) returns (ListEmployeesByClinicResponse) {
    option (google.api.http) = {get: "/v1/clinics/{clinic_id}/employees"};
  }
  rpc ListEmployeesByOrganization(ListEmployeesByOrganizationRequest) returns (ListEmployeesByOrganizationResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/employees"};
  }
  rpc CountEmployeesByDepartment(CountEmployeesByDepartmentRequest) returns (CountEmployeesByDepartmentResponse) {
    option (google.api.http) = {get: "/v1/departments/{department_id}/employees:count"};
  }
  rpc CountEmployeesByClinic(CountEmployeesByClinicRequest) returns (CountEmployeesByClinicResponse) {
    option (google.api.http) = {get: "/v1/clinics/{clinic_id}/employees:count"};
  }
  rpc CountEmployeesByOrganization(CountEmployeesByOrganizationRequest) returns (CountEmployeesByOrganizationResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/employees:count"};
  }
  rpc SearchEmployeesByOrganization(SearchEmployeesByOrganizationRequest) returns (SearchEmployeesByOrganizationResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/employees:search"};
  }

  rpc ListVacationsByEmployee(ListVacationsByEmployeeRequest) returns (ListVacationsByEmployeeResponse) {
    option (google.api.http) = {get: "/v1/employees/{employee_id}/vacations"};
  }
  rpc CountVacationsByEmployee(CountVacationsByEmployeeRequest) returns (CountVacationsByEmployeeResponse) {
    option (google.api.http) = {get: "/v1/employees/{employee_id}/vacations:count"};
  }

  rpc GetClinicHead(GetClinicHeadRequest) returns (GetClinicHeadResponse) {
    option (google.api.http) = {get: "/v1/clinics/{clinic_id}/head"};
  }
  rpc GetDepartmentResponsible(GetDepartmentResponsibleRequest) returns (GetDepartmentResponsibleResponse) {
    option (google.api.http) = {get: "/v1/departments/{department_id}/responsible"};
  }
  rpc ListOrgAdmins(ListOrgAdminsRequest) returns (ListOrgAdminsResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/admins"};
  }
  rpc ListOrgDispatchers(ListOrgDispatchersRequest) returns (ListOrgDispatchersResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/dispatchers"};
  }
  rpc ListOrgHeads(ListOrgHeadsRequest) returns (ListOrgHeadsResponse) {
    option (google.api.http) = {get: "/v1/organizations/{organization_id}/heads"};
  }
  rpc ListSystemAdmins(ListSystemAdminsRequest) returns (ListSystemAdminsResponse) {
    option (google.api.http) = {get: "/v1/system-admins"};
  }
}

// EmployeeCardView is the denormalised card projection returned by
// both Get and List endpoints. Fields mirror projections.employee_cards
// columns; timestamps are RFC3339 strings. Optional fields stay unset
// when the backing column is NULL.
message EmployeeCardView {
  string employee_id = 1;
  string zitadel_user_id = 2;
  optional string first_name = 3;
  optional string last_name = 4;
  optional string display_name = 5;
  optional string email = 6;
  string organization_id = 7;
  optional string organization_name = 8;
  optional string clinic_id = 9;
  optional string clinic_name = 10;
  string department_id = 11;
  optional string department_name = 12;
  optional string position = 13;
  optional string terminated_at = 14;
  optional string current_vacation_ends_at = 15;
  optional string next_vacation_starts_at = 16;
}

// VacationView mirrors projections.employee_vacations. state is one of
// {scheduled, active, ended, cancelled}.
message VacationView {
  string id = 1;
  string employee_id = 2;
  string state = 3;
  string starts_at = 4;
  optional string ends_at = 5;
  string created_at = 6;
  string updated_at = 7;
}

// RoleAssignment is a role row enriched with the denormalised card for
// the holder and, when present, the deputy. Read-model callers use
// this so they do not need to follow role lookups with N+1 GetEmployee
// calls to render a name or email.
message RoleAssignment {
  EmployeeCardView holder = 1;
  optional EmployeeCardView deputy = 2;
}

// SystemAdminView is the system-admin role; system admins are rooted in
// Zitadel user ids, not employee ids.
message SystemAdminView {
  string zitadel_user_id = 1;
  string created_at = 2;
}

message GetEmployeeRequest {
  string id = 1;
}
message GetEmployeeResponse {
  EmployeeCardView employee = 1;
}

message ListEmployeesByDepartmentRequest {
  string department_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  // When false (default), rows with terminated_at IS NOT NULL are
  // hidden. Set true to include offboarded employees.
  bool include_terminated = 4;
  // When true, restrict to employees currently on an active vacation
  // (current_vacation_ends_at IS NOT NULL AND > now()).
  bool on_vacation = 5;
  // Optional exact-match filter on employee_cards.position. Trimmed
  // before comparison; all-whitespace is treated as unset.
  optional string position = 6;
}
message ListEmployeesByDepartmentResponse {
  repeated EmployeeCardView items = 1;
}

message ListEmployeesByClinicRequest {
  string clinic_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  // When false (default), rows with terminated_at IS NOT NULL are
  // hidden. Set true to include offboarded employees.
  bool include_terminated = 4;
  // When true, restrict to employees currently on an active vacation
  // (current_vacation_ends_at IS NOT NULL AND > now()).
  bool on_vacation = 5;
  // Optional exact-match filter on employee_cards.position. Trimmed
  // before comparison; all-whitespace is treated as unset.
  optional string position = 6;
}
message ListEmployeesByClinicResponse {
  repeated EmployeeCardView items = 1;
}

message ListEmployeesByOrganizationRequest {
  string organization_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  // When false (default), rows with terminated_at IS NOT NULL are
  // hidden. Set true to include offboarded employees.
  bool include_terminated = 4;
  // When true, restrict to employees currently on an active vacation
  // (current_vacation_ends_at IS NOT NULL AND > now()).
  bool on_vacation = 5;
  // Optional exact-match filter on employee_cards.position. Trimmed
  // before comparison; all-whitespace is treated as unset.
  optional string position = 6;
}
message ListEmployeesByOrganizationResponse {
  repeated EmployeeCardView items = 1;
}

message CountEmployeesByDepartmentRequest {
  string department_id = 1;
  // When false (default), rows with terminated_at IS NOT NULL are
  // hidden. Set true to include offboarded employees.
  bool include_terminated = 2;
  // When true, restrict to employees currently on an active vacation
  // (current_vacation_ends_at IS NOT NULL AND > now()).
  bool on_vacation = 3;
  // Optional exact-match filter on employee_cards.position. Trimmed
  // before comparison; all-whitespace is treated as unset.
  optional string position = 4;
}
message CountEmployeesByDepartmentResponse {
  int64 total = 1;
}

message CountEmployeesByClinicRequest {
  string clinic_id = 1;
  // When false (default), rows with terminated_at IS NOT NULL are
  // hidden. Set true to include offboarded employees.
  bool include_terminated = 2;
  // When true, restrict to employees currently on an active vacation
  // (current_vacation_ends_at IS NOT NULL AND > now()).
  bool on_vacation = 3;
  // Optional exact-match filter on employee_cards.position. Trimmed
  // before comparison; all-whitespace is treated as unset.
  optional string position = 4;
}
message CountEmployeesByClinicResponse {
  int64 total = 1;
}

message CountEmployeesByOrganizationRequest {
  string organization_id = 1;
  // When false (default), rows with terminated_at IS NOT NULL are
  // hidden. Set true to include offboarded employees.
  bool include_terminated = 2;
  // When true, restrict to employees currently on an active vacation
  // (current_vacation_ends_at IS NOT NULL AND > now()).
  bool on_vacation = 3;
  // Optional exact-match filter on employee_cards.position. Trimmed
  // before comparison; all-whitespace is treated as unset.
  optional string position = 4;
}
message CountEmployeesByOrganizationResponse {
  int64 total = 1;
}

message SearchEmployeesByOrganizationRequest {
  string organization_id = 1;
  // Fuzzy substring matched case-insensitively (ILIKE %query%) against
  // first_name, last_name, display_name, and email. Trimmed at the
  // handler boundary; an empty query degenerates to the same behaviour
  // as ListEmployeesByOrganization with the same filters. Maximum
  // length 256 characters; over-long inputs are rejected before the
  // authz round-trip.
  string query = 2;
  int32 limit = 3;
  int32 offset = 4;
  // When false (default), rows with terminated_at IS NOT NULL are
  // hidden. Set true to include offboarded employees.
  bool include_terminated = 5;
  // When true, restrict to employees currently on an active vacation
  // (current_vacation_ends_at IS NOT NULL AND > now()).
  bool on_vacation = 6;
  // Optional exact-match filter on employee_cards.position. Trimmed
  // before comparison; all-whitespace is treated as unset.
  optional string position = 7;
}
message SearchEmployeesByOrganizationResponse {
  repeated EmployeeCardView items = 1;
}

message ListVacationsByEmployeeRequest {
  string employee_id = 1;
  // Optional state filter. When empty, all states are returned.
  // Valid values: scheduled, active, ended, cancelled.
  string state = 2;
  int32 limit = 3;
  int32 offset = 4;
}
message ListVacationsByEmployeeResponse {
  repeated VacationView items = 1;
}

message CountVacationsByEmployeeRequest {
  string employee_id = 1;
  // Optional state filter. When empty, counts all states.
  // Valid values: scheduled, active, ended, cancelled.
  string state = 2;
}
message CountVacationsByEmployeeResponse {
  int64 total = 1;
}

message GetClinicHeadRequest {
  string clinic_id = 1;
}
message GetClinicHeadResponse {
  optional RoleAssignment assignment = 1;
}

message GetDepartmentResponsibleRequest {
  string department_id = 1;
}
message GetDepartmentResponsibleResponse {
  optional RoleAssignment assignment = 1;
}

message ListOrgAdminsRequest {
