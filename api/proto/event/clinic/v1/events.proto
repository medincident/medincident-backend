syntax = "proto3";

package event.clinic.v1;

// Events for the Clinic aggregate. Self-contained — declares its own
// Address and Point types. Parent organization id is carried inside
// ClinicCreated for projection bootstrap; envelope.aggregate_id holds
// the clinic id itself.

message Point {
  double longitude = 1;
  double latitude = 2;
}

message Address {
  string text = 1;
  optional Point point = 2;
}

message ClinicCreated {
  string organization_id = 1;
  string name = 2;
  optional string description = 3;
  Address physical_address = 4;
}

message ClinicDetailsChanged {
  string name = 1;
  optional string description = 2;
}

message ClinicPhysicalAddressChanged {
  Address physical_address = 1;
}

// ------ ClinicHead role events ------

// ClinicHeadAssigned — an employee became the head of this clinic.
// Payload carries the holder; aggregate_id in the envelope is
// clinic_id.
message ClinicHeadAssigned {
  string employee_id = 1;
}

// ClinicHeadRevoked — role revoked (explicit or cascade from
// cross-clinic transfer / termination).
message ClinicHeadRevoked {
  string employee_id = 1;
}

// ClinicHeadDeputyAssigned — a deputy was attached. The deputy must
// currently work in any department of this clinic.
message ClinicHeadDeputyAssigned {
  string employee_id = 1;
  string deputy_employee_id = 2;
}

// ClinicHeadDeputyRemoved — the deputy slot was cleared.
message ClinicHeadDeputyRemoved {
  string employee_id = 1;
}
