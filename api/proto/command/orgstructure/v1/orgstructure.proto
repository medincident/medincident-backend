syntax = "proto3";

package command.orgstructure.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"validation_failed\",\"message\":\"Validation failed.\",\"details\":{\"violations\":[{\"field\":\"field_name\",\"rule\":\"required\",\"message\":\"field is required\"}]}}"
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unauthenticated\",\"message\":\"unauthenticated\"}"
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"permission_denied\",\"message\":\"permission denied\"}"
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unexpected_error\",\"message\":\"internal error\"}"
      }
    }
  }
};

// OrgStructureCommandService is the command-side contract for the three
// organisational structure aggregates: Organization, Clinic, and
// Department. Every mutation returns either an identifier (Create) or
// an empty response (Update). google.api.http annotations drive the
// gateway-server binary in this repo (cmd/gateway-server): the
// command-server itself serves pure gRPC, and gateway-server dials
// into it and exposes a REST facade using the grpc-gateway stubs
// generated under pkg/.
service OrgStructureCommandService {
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse) {
    option (google.api.http) = {
      post: "/v1/organizations"
      body: "*"
    };
  }
  rpc UpdateOrganizationDetails(UpdateOrganizationDetailsRequest) returns (UpdateOrganizationDetailsResponse) {
    option (google.api.http) = {
      put: "/v1/organizations/{organization_id}/details"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"organization_not_found\",\"message\":\"Organization not found.\"}"
          }
        }
      }
    };
  }
  rpc UpdateOrganizationLegalAddress(UpdateOrganizationLegalAddressRequest) returns (UpdateOrganizationLegalAddressResponse) {
    option (google.api.http) = {
      put: "/v1/organizations/{organization_id}/legal-address"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"organization_not_found\",\"message\":\"Organization not found.\"}"
          }
        }
      }
    };
  }

  rpc CreateClinic(CreateClinicRequest) returns (CreateClinicResponse) {
    option (google.api.http) = {
      post: "/v1/organizations/{organization_id}/clinics"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `clinic_organization_not_found` — organization with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"clinic_organization_not_found\",\"message\":\"Organization not found.\"}"
          }
        }
      }
    };
  }
  rpc UpdateClinicDetails(UpdateClinicDetailsRequest) returns (UpdateClinicDetailsResponse) {
    option (google.api.http) = {
      put: "/v1/clinics/{clinic_id}/details"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `clinic_not_found` — clinic with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"clinic_not_found\",\"message\":\"Clinic not found.\"}"
          }
        }
      }
    };
  }
  rpc UpdateClinicPhysicalAddress(UpdateClinicPhysicalAddressRequest) returns (UpdateClinicPhysicalAddressResponse) {
    option (google.api.http) = {
      put: "/v1/clinics/{clinic_id}/physical-address"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `clinic_not_found` — clinic with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"clinic_not_found\",\"message\":\"Clinic not found.\"}"
          }
        }
      }
    };
  }

  rpc CreateDepartment(CreateDepartmentRequest) returns (CreateDepartmentResponse) {
    option (google.api.http) = {
      post: "/v1/clinics/{clinic_id}/departments"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `department_clinic_not_found` — clinic with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"department_clinic_not_found\",\"message\":\"Clinic not found.\"}"
          }
        }
      }
    };
  }
  rpc UpdateDepartmentDetails(UpdateDepartmentDetailsRequest) returns (UpdateDepartmentDetailsResponse) {
    option (google.api.http) = {
      put: "/v1/departments/{department_id}/details"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `department_not_found` — department with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"department_not_found\",\"message\":\"Department not found.\"}"
          }
        }
      }
    };
  }
}

// ------ Shared request value types (inside this service package) ------

message PointInput {
  double longitude = 1;
  double latitude = 2;
}

message AddressInput {
  string text = 1 [(google.api.field_behavior) = REQUIRED];
  optional PointInput point = 2;
}

// ------ Organization ------

message CreateOrganizationRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  AddressInput legal_address = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message CreateOrganizationResponse {
  string organization_id = 1;
}

message UpdateOrganizationDetailsRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message UpdateOrganizationDetailsResponse {}

message UpdateOrganizationLegalAddressRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  AddressInput legal_address = 2 [(google.api.field_behavior) = REQUIRED];
}
message UpdateOrganizationLegalAddressResponse {}

// ------ Clinic ------

message CreateClinicRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  AddressInput physical_address = 3 [(google.api.field_behavior) = REQUIRED];
  optional string description = 4;
}
message CreateClinicResponse {
  string clinic_id = 1;
}

message UpdateClinicDetailsRequest {
  string clinic_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message UpdateClinicDetailsResponse {}

message UpdateClinicPhysicalAddressRequest {
  string clinic_id = 1 [(google.api.field_behavior) = REQUIRED];
  AddressInput physical_address = 2 [(google.api.field_behavior) = REQUIRED];
}
message UpdateClinicPhysicalAddressResponse {}

// ------ Department ------

message CreateDepartmentRequest {
  string clinic_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message CreateDepartmentResponse {
  string department_id = 1;
}

message UpdateDepartmentDetailsRequest {
  string department_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message UpdateDepartmentDetailsResponse {}
