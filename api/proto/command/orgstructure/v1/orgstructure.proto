syntax = "proto3";

package command.orgstructure.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
};

// OrgStructureCommandService is the command-side contract for the three
// organisational structure aggregates: Organization, Clinic, and
// Department. Every mutation returns either an identifier (Create) or
// an empty response (Update). google.api.http annotations drive the
// gateway-server binary in this repo (cmd/gateway-server): the
// command-server itself serves pure gRPC, and gateway-server dials
// into it and exposes a REST facade using the grpc-gateway stubs
// generated under pkg/.
service OrgStructureCommandService {
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse) {
    option (google.api.http) = {
      post: "/v1/organizations"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "500"
        value: {description: "Internal server error. Error codes:\n- `organization_id_generation_failed` — failed to generate a new organization ID.\n- `organization_save_failed` — database write failed."}
      }
    };
  }
  rpc UpdateOrganizationDetails(UpdateOrganizationDetailsRequest) returns (UpdateOrganizationDetailsResponse) {
    option (google.api.http) = {
      put: "/v1/organizations/{organization_id}/details"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist."}
      }
    };
  }
  rpc UpdateOrganizationLegalAddress(UpdateOrganizationLegalAddressRequest) returns (UpdateOrganizationLegalAddressResponse) {
    option (google.api.http) = {
      put: "/v1/organizations/{organization_id}/legal-address"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist."}
      }
    };
  }
  rpc DeactivateOrganization(DeactivateOrganizationRequest) returns (DeactivateOrganizationResponse) {
    option (google.api.http) = {
      post: "/v1/organizations/{organization_id}/deactivate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist."}
      }
    };
  }
  rpc ActivateOrganization(ActivateOrganizationRequest) returns (ActivateOrganizationResponse) {
    option (google.api.http) = {
      post: "/v1/organizations/{organization_id}/activate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist."}
      }
    };
  }
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse) {
    option (google.api.http) = {delete: "/v1/organizations/{organization_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `organization_delete_has_dependents` — organization has associated incidents or service requests."}
      }
    };
  }

  rpc CreateClinic(CreateClinicRequest) returns (CreateClinicResponse) {
    option (google.api.http) = {
      post: "/v1/organizations/{organization_id}/clinics"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `clinic_organization_not_found` — organization with the given ID does not exist."}
      }
    };
  }
  rpc UpdateClinicDetails(UpdateClinicDetailsRequest) returns (UpdateClinicDetailsResponse) {
    option (google.api.http) = {
      put: "/v1/clinics/{clinic_id}/details"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `clinic_not_found` — clinic with the given ID does not exist."}
      }
    };
  }
  rpc UpdateClinicPhysicalAddress(UpdateClinicPhysicalAddressRequest) returns (UpdateClinicPhysicalAddressResponse) {
    option (google.api.http) = {
      put: "/v1/clinics/{clinic_id}/physical-address"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `clinic_not_found` — clinic with the given ID does not exist."}
      }
    };
  }
  rpc DeactivateClinic(DeactivateClinicRequest) returns (DeactivateClinicResponse) {
    option (google.api.http) = {
      post: "/v1/clinics/{clinic_id}/deactivate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `clinic_not_found` — clinic with the given ID does not exist."}
      }
    };
  }
  rpc ActivateClinic(ActivateClinicRequest) returns (ActivateClinicResponse) {
    option (google.api.http) = {
      post: "/v1/clinics/{clinic_id}/activate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `clinic_not_found` — clinic with the given ID does not exist."}
      }
      responses: {
        key: "422"
        value: {description: "Business rule violation. Error codes:\n- `clinic_activate_parent_inactive` — parent organization is inactive."}
      }
    };
  }
  rpc DeleteClinic(DeleteClinicRequest) returns (DeleteClinicResponse) {
    option (google.api.http) = {delete: "/v1/clinics/{clinic_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `clinic_not_found` — clinic with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `clinic_delete_has_dependents` — clinic has associated incidents or service requests."}
      }
    };
  }

  rpc CreateDepartment(CreateDepartmentRequest) returns (CreateDepartmentResponse) {
    option (google.api.http) = {
      post: "/v1/clinics/{clinic_id}/departments"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `department_clinic_not_found` — clinic with the given ID does not exist."}
      }
    };
  }
  rpc UpdateDepartmentDetails(UpdateDepartmentDetailsRequest) returns (UpdateDepartmentDetailsResponse) {
    option (google.api.http) = {
      put: "/v1/departments/{department_id}/details"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `department_not_found` — department with the given ID does not exist."}
      }
    };
  }
  rpc DeactivateDepartment(DeactivateDepartmentRequest) returns (DeactivateDepartmentResponse) {
    option (google.api.http) = {
      post: "/v1/departments/{department_id}/deactivate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `department_not_found` — department with the given ID does not exist."}
      }
    };
  }
  rpc ActivateDepartment(ActivateDepartmentRequest) returns (ActivateDepartmentResponse) {
    option (google.api.http) = {
      post: "/v1/departments/{department_id}/activate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `department_not_found` — department with the given ID does not exist."}
      }
      responses: {
        key: "422"
        value: {description: "Business rule violation. Error codes:\n- `department_activate_parent_inactive` — parent clinic is inactive."}
      }
    };
  }
  rpc DeleteDepartment(DeleteDepartmentRequest) returns (DeleteDepartmentResponse) {
    option (google.api.http) = {delete: "/v1/departments/{department_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `department_not_found` — department with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `department_delete_has_dependents` — department has associated incidents or service requests."}
      }
    };
  }
}

// ------ Shared request value types (inside this service package) ------

message PointInput {
  double longitude = 1;
  double latitude = 2;
}

message AddressInput {
  string text = 1 [(google.api.field_behavior) = REQUIRED];
  optional PointInput point = 2;
}

// ------ Organization ------

message CreateOrganizationRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  AddressInput legal_address = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message CreateOrganizationResponse {
  string organization_id = 1;
}

message UpdateOrganizationDetailsRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message UpdateOrganizationDetailsResponse {}

message UpdateOrganizationLegalAddressRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  AddressInput legal_address = 2 [(google.api.field_behavior) = REQUIRED];
}
message UpdateOrganizationLegalAddressResponse {}

message DeactivateOrganizationRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeactivateOrganizationResponse {}

message ActivateOrganizationRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ActivateOrganizationResponse {}

message DeleteOrganizationRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeleteOrganizationResponse {}

// ------ Clinic ------

message CreateClinicRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  AddressInput physical_address = 3 [(google.api.field_behavior) = REQUIRED];
  optional string description = 4;
}
message CreateClinicResponse {
  string clinic_id = 1;
}

message UpdateClinicDetailsRequest {
  string clinic_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message UpdateClinicDetailsResponse {}

message UpdateClinicPhysicalAddressRequest {
  string clinic_id = 1 [(google.api.field_behavior) = REQUIRED];
  AddressInput physical_address = 2 [(google.api.field_behavior) = REQUIRED];
}
message UpdateClinicPhysicalAddressResponse {}

message DeactivateClinicRequest {
  string clinic_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeactivateClinicResponse {}

message ActivateClinicRequest {
  string clinic_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ActivateClinicResponse {}

message DeleteClinicRequest {
  string clinic_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeleteClinicResponse {}

// ------ Department ------

message CreateDepartmentRequest {
  string clinic_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message CreateDepartmentResponse {
  string department_id = 1;
}

message UpdateDepartmentDetailsRequest {
  string department_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message UpdateDepartmentDetailsResponse {}

message DeactivateDepartmentRequest {
  string department_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeactivateDepartmentResponse {}

message ActivateDepartmentRequest {
  string department_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ActivateDepartmentResponse {}

message DeleteDepartmentRequest {
  string department_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeleteDepartmentResponse {}
