syntax = "proto3";

package command.request.classifier.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/medincident/medincident-backend/pkg/command/request/classifier/v1;requestclassifierv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
};

service RequestClassifierCommandService {
  rpc CreateRequestType(CreateRequestTypeRequest) returns (CreateRequestTypeResponse) {
    option (google.api.http) = {
      post: "/v1/organizations/{organization_id}/request-types"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `request_type_name_conflict` — a request type with this name already exists in the organization."}
      }
    };
  }
  rpc UpdateRequestTypeDetails(UpdateRequestTypeDetailsRequest) returns (UpdateRequestTypeDetailsResponse) {
    option (google.api.http) = {
      put: "/v1/request-types/{type_id}/details"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `request_type_not_found` — request type with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `request_type_name_conflict` — a request type with this name already exists in the organization."}
      }
    };
  }
  rpc DeactivateRequestType(DeactivateRequestTypeRequest) returns (DeactivateRequestTypeResponse) {
    option (google.api.http) = {post: "/v1/request-types/{type_id}/deactivations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `request_type_not_found` — request type with the given ID does not exist."}
      }
    };
  }
  rpc ReactivateRequestType(ReactivateRequestTypeRequest) returns (ReactivateRequestTypeResponse) {
    option (google.api.http) = {post: "/v1/request-types/{type_id}/reactivations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `request_type_not_found` — request type with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `request_type_name_conflict` — reactivation would create a name conflict with an active type."}
      }
    };
  }
  rpc DeleteRequestType(DeleteRequestTypeRequest) returns (DeleteRequestTypeResponse) {
    option (google.api.http) = {delete: "/v1/request-types/{type_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `request_type_not_found` — request type with the given ID does not exist."}
      }
    };
  }
}

message CreateRequestTypeRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message CreateRequestTypeResponse {
  string type_id = 1;
}

message UpdateRequestTypeDetailsRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message UpdateRequestTypeDetailsResponse {}

message DeactivateRequestTypeRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeactivateRequestTypeResponse {}

message ReactivateRequestTypeRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ReactivateRequestTypeResponse {}

message DeleteRequestTypeRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeleteRequestTypeResponse {}
