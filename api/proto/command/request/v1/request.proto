syntax = "proto3";

package command.request.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/medincident/medincident-backend/pkg/command/request/v1;requestv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ValidationErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"validation_failed\",\"message\":\"Validation failed.\",\"details\":{\"violations\":[{\"field\":\"field_name\",\"rule\":\"required\",\"message\":\"field is required\"}]}}"
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unauthenticated\",\"message\":\"unauthenticated\"}"
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"permission_denied\",\"message\":\"permission denied\"}"
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unexpected_error\",\"message\":\"internal error\"}"
      }
    }
  }
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response (e.g. deadline exceeded or request canceled)."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"deadline_exceeded\",\"message\":\"deadline exceeded\"}"
      }
    }
  }
};

service ServiceRequestCommandService {
  rpc CreateServiceRequest(CreateServiceRequestRequest) returns (CreateServiceRequestResponse) {
    option (google.api.http) = {
      post: "/v1/service-requests"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `service_request_department_not_found` — department with the given ID does not exist.\n- `service_request_type_not_found` — request type with the given ID does not exist.\n- `service_request_incident_not_found` — linked incident with the given ID does not exist.\n- `service_request_employee_not_found` — one of the executor employees was not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"service_request_department_not_found\",\"message\":\"Department not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Failed precondition. Error codes:\n- `service_request_type_inactive` — the request type is inactive.\n- `service_request_type_org_mismatch` — the request type belongs to a different organization.\n- `service_request_incident_org_mismatch` — the linked incident belongs to a different organization.\n- `service_request_employee_dept_mismatch` — an executor employee does not belong to the specified department."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"service_request_type_inactive\",\"message\":\"Request type is inactive.\"}"
          }
        }
      }
    };
  }
  rpc UpdateServiceRequestDescription(UpdateServiceRequestDescriptionRequest) returns (UpdateServiceRequestDescriptionResponse) {
    option (google.api.http) = {
      put: "/v1/service-requests/{service_request_id}/description"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `service_request_not_found` — service request with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"service_request_not_found\",\"message\":\"Service request not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Failed precondition. Error codes:\n- `service_request_frozen` — service request is frozen and cannot be modified."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"service_request_frozen\",\"message\":\"Service request is frozen.\"}"
          }
        }
      }
    };
  }
  rpc UpdateServiceRequestStatus(UpdateServiceRequestStatusRequest) returns (UpdateServiceRequestStatusResponse) {
    option (google.api.http) = {
      put: "/v1/service-requests/{service_request_id}/status"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `service_request_not_found` — service request with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"service_request_not_found\",\"message\":\"Service request not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Failed precondition. Error codes:\n- `service_request_invalid_status_transition` — the requested status transition is not allowed.\n- `service_request_frozen` — service request is frozen and cannot be modified."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"service_request_invalid_status_transition\",\"message\":\"Invalid status transition.\"}"
          }
        }
      }
    };
  }
  rpc AssignExecutors(AssignExecutorsRequest) returns (AssignExecutorsResponse) {
    option (google.api.http) = {
      put: "/v1/service-requests/{service_request_id}/executors"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `service_request_not_found` — service request with the given ID does not exist.\n- `service_request_employee_not_found` — one of the executor employees was not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"service_request_not_found\",\"message\":\"Service request not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Failed precondition. Error codes:\n- `service_request_frozen` — service request is frozen and cannot be modified.\n- `service_request_employee_dept_mismatch` — an executor employee does not belong to the service request's department."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"service_request_frozen\",\"message\":\"Service request is frozen.\"}"
          }
        }
      }
    };
  }
}

message CreateServiceRequestRequest {
  string department_id = 1 [(google.api.field_behavior) = REQUIRED];
  string type_id = 2 [(google.api.field_behavior) = REQUIRED];
  optional string incident_id = 3;
  string description = 4 [(google.api.field_behavior) = REQUIRED];
  repeated string executor_employee_ids = 5 [(google.api.field_behavior) = REQUIRED];
}
message CreateServiceRequestResponse {
  string service_request_id = 1;
}

message UpdateServiceRequestDescriptionRequest {
  string service_request_id = 1 [(google.api.field_behavior) = REQUIRED];
  string description = 2 [(google.api.field_behavior) = REQUIRED];
}
message UpdateServiceRequestDescriptionResponse {}

message UpdateServiceRequestStatusRequest {
  string service_request_id = 1 [(google.api.field_behavior) = REQUIRED];
  string new_status = 2 [(google.api.field_behavior) = REQUIRED];
}
message UpdateServiceRequestStatusResponse {}

message AssignExecutorsRequest {
  string service_request_id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string executor_employee_ids = 2 [(google.api.field_behavior) = REQUIRED];
}
message AssignExecutorsResponse {}
