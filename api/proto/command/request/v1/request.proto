syntax = "proto3";

package command.request.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/medincident/medincident-backend/pkg/command/request/v1;requestv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
};

service ServiceRequestCommandService {
  rpc CreateServiceRequest(CreateServiceRequestRequest) returns (CreateServiceRequestResponse) {
    option (google.api.http) = {
      post: "/v1/service-requests"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
        }
      }
    };
  }
  rpc UpdateServiceRequestDescription(UpdateServiceRequestDescriptionRequest) returns (UpdateServiceRequestDescriptionResponse) {
    option (google.api.http) = {
      put: "/v1/service-requests/{service_request_id}/description"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
        }
      }
    };
  }
  rpc UpdateServiceRequestStatus(UpdateServiceRequestStatusRequest) returns (UpdateServiceRequestStatusResponse) {
    option (google.api.http) = {
      put: "/v1/service-requests/{service_request_id}/status"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
        }
      }
    };
  }
  rpc AssignExecutors(AssignExecutorsRequest) returns (AssignExecutorsResponse) {
    option (google.api.http) = {
      put: "/v1/service-requests/{service_request_id}/executors"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
        }
      }
    };
  }
}

message CreateServiceRequestRequest {
  string department_id = 1 [(google.api.field_behavior) = REQUIRED];
  string type_id = 2 [(google.api.field_behavior) = REQUIRED];
  optional string incident_id = 3;
  string description = 4 [(google.api.field_behavior) = REQUIRED];
  repeated string executor_employee_ids = 5 [(google.api.field_behavior) = REQUIRED];
}
message CreateServiceRequestResponse {
  string service_request_id = 1;
}

message UpdateServiceRequestDescriptionRequest {
  string service_request_id = 1 [(google.api.field_behavior) = REQUIRED];
  string description = 2 [(google.api.field_behavior) = REQUIRED];
}
message UpdateServiceRequestDescriptionResponse {}

message UpdateServiceRequestStatusRequest {
  string service_request_id = 1 [(google.api.field_behavior) = REQUIRED];
  string new_status = 2 [(google.api.field_behavior) = REQUIRED];
}
message UpdateServiceRequestStatusResponse {}

message AssignExecutorsRequest {
  string service_request_id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string executor_employee_ids = 2 [(google.api.field_behavior) = REQUIRED];
}
message AssignExecutorsResponse {}
