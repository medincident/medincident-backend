syntax = "proto3";

package command.incident.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/medincident/medincident-backend/pkg/command/incident/v1;incidentv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
};

// IncidentCommandService is the write-side contract for incidents
// created directly by employees (not the patient buffer).
service IncidentCommandService {
  rpc CreateIncident(CreateIncidentRequest) returns (CreateIncidentResponse) {
    option (google.api.http) = {
      post: "/v1/incidents"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Resource not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
        }
      }
    };
  }
  rpc CancelIncident(CancelIncidentRequest) returns (CancelIncidentResponse) {
    option (google.api.http) = {post: "/v1/incidents/{incident_id}:cancel"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Resource not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
        }
      }
    };
  }
  rpc UpdateIncidentStatus(UpdateIncidentStatusRequest) returns (UpdateIncidentStatusResponse) {
    option (google.api.http) = {
      put: "/v1/incidents/{incident_id}/status"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Resource not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
        }
      }
    };
  }
  rpc UpdateIncidentPriority(UpdateIncidentPriorityRequest) returns (UpdateIncidentPriorityResponse) {
    option (google.api.http) = {
      put: "/v1/incidents/{incident_id}/priority"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Resource not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
        }
      }
    };
  }
  rpc UpdateIncidentDescription(UpdateIncidentDescriptionRequest) returns (UpdateIncidentDescriptionResponse) {
    option (google.api.http) = {
      put: "/v1/incidents/{incident_id}/description"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Resource not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
        }
      }
    };
  }
  rpc ReopenIncident(ReopenIncidentRequest) returns (ReopenIncidentResponse) {
    option (google.api.http) = {post: "/v1/incidents/{incident_id}:reopen"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Resource not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
        }
      }
    };
  }
}

enum IncidentStatus {
  INCIDENT_STATUS_UNSPECIFIED = 0;
  INCIDENT_STATUS_PENDING = 1;
  INCIDENT_STATUS_IN_PROGRESS = 2;
  INCIDENT_STATUS_DONE = 3;
  INCIDENT_STATUS_REJECTED = 4;
  INCIDENT_STATUS_CANCELLED = 5;
}

enum IncidentPriority {
  INCIDENT_PRIORITY_UNSPECIFIED = 0;
  INCIDENT_PRIORITY_LOW = 1;
  INCIDENT_PRIORITY_NORMAL = 2;
  INCIDENT_PRIORITY_HIGH = 3;
  INCIDENT_PRIORITY_CRITICAL = 4;
}

message CreateIncidentRequest {
  string department_id = 1 [(google.api.field_behavior) = REQUIRED];
  string category_id = 2 [(google.api.field_behavior) = REQUIRED];
  string type_id = 3 [(google.api.field_behavior) = REQUIRED];
  optional string description = 4;
  string occurred_at = 5 [(google.api.field_behavior) = REQUIRED]; // RFC3339Nano
}
message CreateIncidentResponse {
  string incident_id = 1;
}

message CancelIncidentRequest {
  string incident_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message CancelIncidentResponse {}

// UpdateIncidentStatus only handles forward transitions:
// pending -> in_progress, in_progress -> done, in_progress -> rejected.
// Cancellation by registrar uses CancelIncident.
message UpdateIncidentStatusRequest {
  string incident_id = 1 [(google.api.field_behavior) = REQUIRED];
  IncidentStatus new_status = 2 [(google.api.field_behavior) = REQUIRED];
}
message UpdateIncidentStatusResponse {}

message UpdateIncidentPriorityRequest {
  string incident_id = 1 [(google.api.field_behavior) = REQUIRED];
  IncidentPriority priority = 2 [(google.api.field_behavior) = REQUIRED];
}
message UpdateIncidentPriorityResponse {}

message UpdateIncidentDescriptionRequest {
  string incident_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string description = 2;
}
message UpdateIncidentDescriptionResponse {}

message ReopenIncidentRequest {
  string incident_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ReopenIncidentResponse {
  string reopened_incident_id = 1;
}
