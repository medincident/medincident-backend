syntax = "proto3";

package command.incident.buffer.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/medincident/medincident-backend/pkg/command/incident/buffer/v1;bufferv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"validation_failed\",\"message\":\"Validation failed.\",\"details\":{\"violations\":[{\"field\":\"field_name\",\"rule\":\"required\",\"message\":\"field is required\"}]}}"
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unauthenticated\",\"message\":\"unauthenticated\"}"
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"permission_denied\",\"message\":\"permission denied\"}"
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unexpected_error\",\"message\":\"internal error\"}"
      }
    }
  }
};

// IncidentBufferCommandService handles the patient submission flow:
// patients SubmitPatientIncident, may UpdatePatientIncident or
// CancelPatientIncident while pending; dispatchers PublishPatientIncident
// (creates a real incident) or RejectPatientIncident.
service IncidentBufferCommandService {
  rpc SubmitPatientIncident(SubmitPatientIncidentRequest) returns (SubmitPatientIncidentResponse) {
    option (google.api.http) = {
      post: "/v1/patient-incidents"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `buffer_organization_not_found` — organization with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"buffer_organization_not_found\",\"message\":\"Organization not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed or precondition not met. Error codes:\n- `buffer_type_not_allowed_for_patients` — the selected incident type is not available for patient submissions."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"buffer_type_not_allowed_for_patients\",\"message\":\"Incident type is not allowed for patient submissions.\"}"
          }
        }
      }
    };
  }
  rpc UpdatePatientIncident(UpdatePatientIncidentRequest) returns (UpdatePatientIncidentResponse) {
    option (google.api.http) = {
      put: "/v1/patient-incidents/{buffer_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `buffer_not_found` — patient incident with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"buffer_not_found\",\"message\":\"Patient incident not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed or precondition not met. Error codes:\n- `buffer_not_pending` — patient incident is not in pending status and cannot be updated."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"buffer_not_pending\",\"message\":\"Patient incident is not in pending status.\"}"
          }
        }
      }
      responses: {
        key: "403"
        value: {
          description: "Permission denied. Error codes:\n- `buffer_not_patient_owner` — caller is not the patient who submitted this incident."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"buffer_not_patient_owner\",\"message\":\"Not the owner of this patient incident.\"}"
          }
        }
      }
    };
  }
  rpc CancelPatientIncident(CancelPatientIncidentRequest) returns (CancelPatientIncidentResponse) {
    option (google.api.http) = {post: "/v1/patient-incidents/{buffer_id}:cancel"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `buffer_not_found` — patient incident with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"buffer_not_found\",\"message\":\"Patient incident not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed or precondition not met. Error codes:\n- `buffer_not_pending` — patient incident is not in pending status and cannot be cancelled."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"buffer_not_pending\",\"message\":\"Patient incident is not in pending status.\"}"
          }
        }
      }
      responses: {
        key: "403"
        value: {
          description: "Permission denied. Error codes:\n- `buffer_not_patient_owner` — caller is not the patient who submitted this incident."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"buffer_not_patient_owner\",\"message\":\"Not the owner of this patient incident.\"}"
          }
        }
      }
    };
  }
  rpc PublishPatientIncident(PublishPatientIncidentRequest) returns (PublishPatientIncidentResponse) {
    option (google.api.http) = {
      post: "/v1/patient-incidents/{buffer_id}:publish"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `buffer_not_found` — patient incident with the given ID does not exist.\n- `buffer_department_not_found` — department with the given ID does not exist.\n- `buffer_category_not_found` — category with the given ID does not exist.\n- `buffer_dispatcher_not_found` — dispatcher employee not found."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"buffer_not_found\",\"message\":\"Patient incident not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed or precondition not met. Error codes:\n- `buffer_not_pending` — patient incident is not in pending status and cannot be published."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"buffer_not_pending\",\"message\":\"Patient incident is not in pending status.\"}"
          }
        }
      }
    };
  }
  rpc RejectPatientIncident(RejectPatientIncidentRequest) returns (RejectPatientIncidentResponse) {
    option (google.api.http) = {post: "/v1/patient-incidents/{buffer_id}:reject"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `buffer_not_found` — patient incident with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"buffer_not_found\",\"message\":\"Patient incident not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed or precondition not met. Error codes:\n- `buffer_not_pending` — patient incident is not in pending status and cannot be rejected."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"buffer_not_pending\",\"message\":\"Patient incident is not in pending status.\"}"
          }
        }
      }
    };
  }
}

message SubmitPatientIncidentRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string category_id = 2;
  optional string type_id = 3;
  optional string description = 4;
  optional string occurred_at = 5; // RFC3339Nano
}
message SubmitPatientIncidentResponse {
  string buffer_id = 1;
}

message UpdatePatientIncidentRequest {
  string buffer_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string category_id = 2;
  optional string type_id = 3;
  optional string description = 4;
  optional string occurred_at = 5;
}
message UpdatePatientIncidentResponse {}

message CancelPatientIncidentRequest {
  string buffer_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message CancelPatientIncidentResponse {}

message PublishPatientIncidentRequest {
  string buffer_id = 1 [(google.api.field_behavior) = REQUIRED];
  string department_id = 2 [(google.api.field_behavior) = REQUIRED];
  string category_id = 3 [(google.api.field_behavior) = REQUIRED];
  string type_id = 4 [(google.api.field_behavior) = REQUIRED];
  optional string description = 5; // dispatcher's edited description
}
message PublishPatientIncidentResponse {
  string incident_id = 1;
}

message RejectPatientIncidentRequest {
  string buffer_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message RejectPatientIncidentResponse {}
