syntax = "proto3";

package command.incident.buffer.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/medincident/medincident-backend/pkg/command/incident/buffer/v1;bufferv1";

// IncidentBufferCommandService handles the patient submission flow:
// patients SubmitPatientIncident, may UpdatePatientIncident or
// CancelPatientIncident while pending; dispatchers PublishPatientIncident
// (creates a real incident) or RejectPatientIncident.
service IncidentBufferCommandService {
  rpc SubmitPatientIncident(SubmitPatientIncidentRequest) returns (SubmitPatientIncidentResponse) {
    option (google.api.http) = {
      post: "/v1/patient-incidents"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `buffer_organization_not_found` — organization with the given ID does not exist.\n- `buffer_category_not_found` — category with the given ID does not exist.\n- `buffer_type_not_found` — incident type with the given ID does not exist."}
      }
      responses: {
        key: "400"
        value: {description: "Validation failed or precondition not met. Error codes:\n- `buffer_type_not_allowed_for_patients` — the selected incident type is not available for patient submissions.\n- `buffer_occurred_at_invalid` — the occurred_at timestamp is not a valid RFC3339 date."}
      }
    };
  }
  rpc UpdatePatientIncident(UpdatePatientIncidentRequest) returns (UpdatePatientIncidentResponse) {
    option (google.api.http) = {
      put: "/v1/patient-incidents/{buffer_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `buffer_not_found` — patient incident with the given ID does not exist.\n- `buffer_category_not_found` — category with the given ID does not exist.\n- `buffer_type_not_found` — incident type with the given ID does not exist."}
      }
      responses: {
        key: "400"
        value: {description: "Validation failed or precondition not met. Error codes:\n- `buffer_not_pending` — patient incident is not in pending status and cannot be updated.\n- `buffer_type_not_allowed_for_patients` — the selected incident type is not available for patient submissions.\n- `buffer_occurred_at_invalid` — the occurred_at timestamp is not a valid RFC3339 date."}
      }
      responses: {
        key: "403"
        value: {description: "Permission denied. Error codes:\n- `buffer_not_patient_owner` — caller is not the patient who submitted this incident."}
      }
    };
  }
  rpc CancelPatientIncident(CancelPatientIncidentRequest) returns (CancelPatientIncidentResponse) {
    option (google.api.http) = {post: "/v1/patient-incidents/{buffer_id}:cancel"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `buffer_not_found` — patient incident with the given ID does not exist."}
      }
      responses: {
        key: "400"
        value: {description: "Validation failed or precondition not met. Error codes:\n- `buffer_not_pending` — patient incident is not in pending status and cannot be cancelled."}
      }
      responses: {
        key: "403"
        value: {description: "Permission denied. Error codes:\n- `buffer_not_patient_owner` — caller is not the patient who submitted this incident."}
      }
    };
  }
  rpc PublishPatientIncident(PublishPatientIncidentRequest) returns (PublishPatientIncidentResponse) {
    option (google.api.http) = {
      post: "/v1/patient-incidents/{buffer_id}:publish"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `buffer_not_found` — patient incident with the given ID does not exist.\n- `buffer_department_not_found` — department with the given ID does not exist.\n- `buffer_category_not_found` — category with the given ID does not exist.\n- `buffer_type_not_found` — incident type with the given ID does not exist.\n- `buffer_dispatcher_not_found` — dispatcher employee not found."}
      }
      responses: {
        key: "400"
        value: {description: "Validation failed or precondition not met. Error codes:\n- `buffer_not_pending` — patient incident is not in pending status and cannot be published."}
      }
    };
  }
  rpc RejectPatientIncident(RejectPatientIncidentRequest) returns (RejectPatientIncidentResponse) {
    option (google.api.http) = {post: "/v1/patient-incidents/{buffer_id}:reject"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `buffer_not_found` — patient incident with the given ID does not exist."}
      }
      responses: {
        key: "400"
        value: {description: "Validation failed or precondition not met. Error codes:\n- `buffer_not_pending` — patient incident is not in pending status and cannot be rejected."}
      }
    };
  }
}

message SubmitPatientIncidentRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string category_id = 2;
  optional string type_id = 3;
  optional string description = 4;
  optional string occurred_at = 5; // RFC3339Nano
}
message SubmitPatientIncidentResponse {
  string buffer_id = 1;
}

message UpdatePatientIncidentRequest {
  string buffer_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string category_id = 2;
  optional string type_id = 3;
  optional string description = 4;
  optional string occurred_at = 5;
}
message UpdatePatientIncidentResponse {}

message CancelPatientIncidentRequest {
  string buffer_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message CancelPatientIncidentResponse {}

message PublishPatientIncidentRequest {
  string buffer_id = 1 [(google.api.field_behavior) = REQUIRED];
  string department_id = 2 [(google.api.field_behavior) = REQUIRED];
  string category_id = 3 [(google.api.field_behavior) = REQUIRED];
  string type_id = 4 [(google.api.field_behavior) = REQUIRED];
  optional string description = 5; // dispatcher's edited description
}
message PublishPatientIncidentResponse {
  string incident_id = 1;
}

message RejectPatientIncidentRequest {
  string buffer_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message RejectPatientIncidentResponse {}
