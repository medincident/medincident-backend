syntax = "proto3";

package command.incident.classifier.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// IncidentClassifierService is the command-side contract for a single
// administrative surface that manages an organisation's incident
// classifier: a tree of incident categories (max depth 5) with incident
// types living inside any category. Every mutation returns an id (for
// Create) or an empty response and publishes one domain event per
// touched row.
service IncidentClassifierCommandService {
  // --- Categories ---
  rpc CreateIncidentCategory(CreateIncidentCategoryRequest) returns (CreateIncidentCategoryResponse) {
    option (google.api.http) = {
      post: "/v1/organizations/{organization_id}/incident-categories"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_category_parent_not_found` — parent category with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `incident_category_name_conflict` — a category with this name already exists in the same scope."}
      }
      responses: {
        key: "400"
        value: {description: "Validation failed or precondition not met. Error codes:\n- `incident_category_parent_inactive` — parent category is inactive.\n- `incident_category_max_depth_exceeded` — category tree depth limit (5) would be exceeded."}
      }
    };
  }
  rpc UpdateIncidentCategoryDetails(UpdateIncidentCategoryDetailsRequest) returns (UpdateIncidentCategoryDetailsResponse) {
    option (google.api.http) = {
      put: "/v1/incident-categories/{category_id}/details"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `incident_category_name_conflict` — a category with this name already exists in the same scope."}
      }
    };
  }
  rpc MoveIncidentCategory(MoveIncidentCategoryRequest) returns (MoveIncidentCategoryResponse) {
    option (google.api.http) = {
      post: "/v1/incident-categories/{category_id}:move"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist.\n- `incident_category_parent_not_found` — target parent category with the given ID does not exist."}
      }
      responses: {
        key: "400"
        value: {description: "Validation failed or precondition not met. Error codes:\n- `incident_category_move_organization_mismatch` — target parent belongs to a different organization.\n- `incident_category_move_would_create_cycle` — move would create a cycle in the category tree.\n- `incident_category_move_would_exceed_depth` — move would exceed the maximum category depth.\n- `incident_category_parent_inactive` — target parent category is inactive."}
      }
    };
  }
  rpc DeactivateIncidentCategory(DeactivateIncidentCategoryRequest) returns (DeactivateIncidentCategoryResponse) {
    option (google.api.http) = {post: "/v1/incident-categories/{category_id}/deactivations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist."}
      }
    };
  }
  rpc ReactivateIncidentCategory(ReactivateIncidentCategoryRequest) returns (ReactivateIncidentCategoryResponse) {
    option (google.api.http) = {post: "/v1/incident-categories/{category_id}/reactivations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `incident_category_reactivate_name_conflict` — reactivation would create a name conflict with an active category."}
      }
      responses: {
        key: "400"
        value: {description: "Validation failed or precondition not met. Error codes:\n- `incident_category_reactivate_inactive_ancestor` — an ancestor category is inactive and must be reactivated first."}
      }
    };
  }
  rpc DeleteIncidentCategory(DeleteIncidentCategoryRequest) returns (DeleteIncidentCategoryResponse) {
    option (google.api.http) = {delete: "/v1/incident-categories/{category_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist."}
      }
    };
  }

  // --- Types ---
  rpc CreateIncidentType(CreateIncidentTypeRequest) returns (CreateIncidentTypeResponse) {
    option (google.api.http) = {
      post: "/v1/incident-categories/{category_id}/types"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `incident_type_name_conflict` — a type with this name already exists in the same category."}
      }
      responses: {
        key: "400"
        value: {description: "Validation failed or precondition not met. Error codes:\n- `incident_category_inactive` — the category is inactive; new types cannot be created in an inactive category."}
      }
    };
  }
  rpc UpdateIncidentTypeDetails(UpdateIncidentTypeDetailsRequest) returns (UpdateIncidentTypeDetailsResponse) {
    option (google.api.http) = {
      put: "/v1/incident-types/{type_id}/details"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `incident_type_name_conflict` — a type with this name already exists in the same category."}
      }
    };
  }
  rpc MoveIncidentType(MoveIncidentTypeRequest) returns (MoveIncidentTypeResponse) {
    option (google.api.http) = {
      post: "/v1/incident-types/{type_id}:move"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist.\n- `incident_type_category_not_found` — target category with the given ID does not exist."}
      }
      responses: {
        key: "400"
        value: {description: "Validation failed or precondition not met. Error codes:\n- `incident_type_move_organization_mismatch` — target category belongs to a different organization.\n- `incident_type_category_inactive` — target category is inactive.\n- `incident_category_inactive` — target category is inactive."}
      }
    };
  }
  rpc DeactivateIncidentType(DeactivateIncidentTypeRequest) returns (DeactivateIncidentTypeResponse) {
    option (google.api.http) = {post: "/v1/incident-types/{type_id}/deactivations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."}
      }
    };
  }
  rpc ReactivateIncidentType(ReactivateIncidentTypeRequest) returns (ReactivateIncidentTypeResponse) {
    option (google.api.http) = {post: "/v1/incident-types/{type_id}/reactivations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `incident_type_reactivate_name_conflict` — reactivation would create a name conflict with an active type."}
      }
      responses: {
        key: "400"
        value: {description: "Validation failed or precondition not met. Error codes:\n- `incident_type_reactivate_inactive_ancestor` — the parent category is inactive and must be reactivated first."}
      }
    };
  }
  rpc DeleteIncidentType(DeleteIncidentTypeRequest) returns (DeleteIncidentTypeResponse) {
    option (google.api.http) = {delete: "/v1/incident-types/{type_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."}
      }
    };
  }
  rpc AllowIncidentTypeForPatients(AllowIncidentTypeForPatientsRequest) returns (AllowIncidentTypeForPatientsResponse) {
    option (google.api.http) = {post: "/v1/incident-types/{type_id}/patient-allowances"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."}
      }
    };
  }
  rpc DisallowIncidentTypeForPatients(DisallowIncidentTypeForPatientsRequest) returns (DisallowIncidentTypeForPatientsResponse) {
    option (google.api.http) = {delete: "/v1/incident-types/{type_id}/patient-allowances"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."}
      }
    };
  }
}

// ---- Category messages ----

message CreateIncidentCategoryRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string parent_category_id = 2;
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  optional string description = 4;
}
message CreateIncidentCategoryResponse {
  string category_id = 1;
}

message UpdateIncidentCategoryDetailsRequest {
  string category_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message UpdateIncidentCategoryDetailsResponse {}

message MoveIncidentCategoryRequest {
  string category_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string new_parent_category_id = 2;
}
message MoveIncidentCategoryResponse {}

message DeactivateIncidentCategoryRequest {
  string category_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeactivateIncidentCategoryResponse {}

message ReactivateIncidentCategoryRequest {
  string category_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ReactivateIncidentCategoryResponse {}

message DeleteIncidentCategoryRequest {
  string category_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeleteIncidentCategoryResponse {}

// ---- Type messages ----

message CreateIncidentTypeRequest {
  string category_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message CreateIncidentTypeResponse {
  string type_id = 1;
}

message UpdateIncidentTypeDetailsRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message UpdateIncidentTypeDetailsResponse {}

message MoveIncidentTypeRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
  string new_category_id = 2 [(google.api.field_behavior) = REQUIRED];
}
message MoveIncidentTypeResponse {}

message DeactivateIncidentTypeRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeactivateIncidentTypeResponse {}

message ReactivateIncidentTypeRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ReactivateIncidentTypeResponse {}

message DeleteIncidentTypeRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeleteIncidentTypeResponse {}

message AllowIncidentTypeForPatientsRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message AllowIncidentTypeForPatientsResponse {}

message DisallowIncidentTypeForPatientsRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DisallowIncidentTypeForPatientsResponse {}
