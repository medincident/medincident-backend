syntax = "proto3";

package command.incident.classifier.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"validation_failed\",\"message\":\"Validation failed.\",\"details\":{\"violations\":[{\"field\":\"field_name\",\"rule\":\"required\",\"message\":\"field is required\"}]}}"
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unauthenticated\",\"message\":\"unauthenticated\"}"
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"permission_denied\",\"message\":\"permission denied\"}"
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unexpected_error\",\"message\":\"internal error\"}"
      }
    }
  }
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response (e.g. deadline exceeded or request canceled)."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"deadline_exceeded\",\"message\":\"deadline exceeded\"}"
      }
    }
  }
};

// IncidentClassifierService is the command-side contract for a single
// administrative surface that manages an organisation's incident
// classifier: a tree of incident categories (max depth 5) with incident
// types living inside any category. Every mutation returns an id (for
// Create) or an empty response and publishes one domain event per
// touched row.
service IncidentClassifierCommandService {
  // --- Categories ---
  rpc CreateIncidentCategory(CreateIncidentCategoryRequest) returns (CreateIncidentCategoryResponse) {
    option (google.api.http) = {
      post: "/v1/organizations/{organization_id}/incident-categories"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_category_parent_not_found` — parent category with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_parent_not_found\",\"message\":\"Parent category not found.\"}"
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Conflict. Error codes:\n- `incident_category_name_conflict` — a category with this name already exists in the same scope."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_name_conflict\",\"message\":\"Category name already exists.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed or precondition not met. Error codes:\n- `incident_category_parent_inactive` — parent category is inactive.\n- `incident_category_max_depth_exceeded` — category tree depth limit (5) would be exceeded."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_parent_inactive\",\"message\":\"Parent category is inactive.\"}"
          }
        }
      }
    };
  }
  rpc UpdateIncidentCategoryDetails(UpdateIncidentCategoryDetailsRequest) returns (UpdateIncidentCategoryDetailsResponse) {
    option (google.api.http) = {
      put: "/v1/incident-categories/{category_id}/details"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_not_found\",\"message\":\"Category not found.\"}"
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Conflict. Error codes:\n- `incident_category_name_conflict` — a category with this name already exists in the same scope."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_name_conflict\",\"message\":\"Category name already exists.\"}"
          }
        }
      }
    };
  }
  rpc MoveIncidentCategory(MoveIncidentCategoryRequest) returns (MoveIncidentCategoryResponse) {
    option (google.api.http) = {
      post: "/v1/incident-categories/{category_id}:move"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist.\n- `incident_category_parent_not_found` — target parent category with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_not_found\",\"message\":\"Category not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed or precondition not met. Error codes:\n- `incident_category_move_organization_mismatch` — target parent belongs to a different organization.\n- `incident_category_move_would_create_cycle` — move would create a cycle in the category tree.\n- `incident_category_move_would_exceed_depth` — move would exceed the maximum category depth.\n- `incident_category_parent_inactive` — target parent category is inactive."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_move_would_create_cycle\",\"message\":\"Move would create a cycle.\"}"
          }
        }
      }
    };
  }
  rpc DeactivateIncidentCategory(DeactivateIncidentCategoryRequest) returns (DeactivateIncidentCategoryResponse) {
    option (google.api.http) = {post: "/v1/incident-categories/{category_id}/deactivations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_not_found\",\"message\":\"Category not found.\"}"
          }
        }
      }
    };
  }
  rpc ReactivateIncidentCategory(ReactivateIncidentCategoryRequest) returns (ReactivateIncidentCategoryResponse) {
    option (google.api.http) = {post: "/v1/incident-categories/{category_id}/reactivations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_not_found\",\"message\":\"Category not found.\"}"
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Conflict. Error codes:\n- `incident_category_reactivate_name_conflict` — reactivation would create a name conflict with an active category."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_reactivate_name_conflict\",\"message\":\"Name conflict on reactivation.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed or precondition not met. Error codes:\n- `incident_category_reactivate_inactive_ancestor` — an ancestor category is inactive and must be reactivated first."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_reactivate_inactive_ancestor\",\"message\":\"Ancestor category is inactive.\"}"
          }
        }
      }
    };
  }
  rpc DeleteIncidentCategory(DeleteIncidentCategoryRequest) returns (DeleteIncidentCategoryResponse) {
    option (google.api.http) = {delete: "/v1/incident-categories/{category_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_not_found\",\"message\":\"Category not found.\"}"
          }
        }
      }
    };
  }

  // --- Types ---
  rpc CreateIncidentType(CreateIncidentTypeRequest) returns (CreateIncidentTypeResponse) {
    option (google.api.http) = {
      post: "/v1/incident-categories/{category_id}/types"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_category_not_found` — category with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_not_found\",\"message\":\"Category not found.\"}"
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Conflict. Error codes:\n- `incident_type_name_conflict` — a type with this name already exists in the same category."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_name_conflict\",\"message\":\"Type name already exists.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed or precondition not met. Error codes:\n- `incident_category_inactive` — the category is inactive; new types cannot be created in an inactive category."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_category_inactive\",\"message\":\"Category is inactive.\"}"
          }
        }
      }
    };
  }
  rpc UpdateIncidentTypeDetails(UpdateIncidentTypeDetailsRequest) returns (UpdateIncidentTypeDetailsResponse) {
    option (google.api.http) = {
      put: "/v1/incident-types/{type_id}/details"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_not_found\",\"message\":\"Type not found.\"}"
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Conflict. Error codes:\n- `incident_type_name_conflict` — a type with this name already exists in the same category."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_name_conflict\",\"message\":\"Type name already exists.\"}"
          }
        }
      }
    };
  }
  rpc MoveIncidentType(MoveIncidentTypeRequest) returns (MoveIncidentTypeResponse) {
    option (google.api.http) = {
      post: "/v1/incident-types/{type_id}:move"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist.\n- `incident_type_category_not_found` — target category with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_not_found\",\"message\":\"Type not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed or precondition not met. Error codes:\n- `incident_type_move_organization_mismatch` — target category belongs to a different organization.\n- `incident_type_category_inactive` — target category is inactive.\n- `incident_category_inactive` — target category is inactive."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_move_organization_mismatch\",\"message\":\"Target category belongs to a different organization.\"}"
          }
        }
      }
    };
  }
  rpc DeactivateIncidentType(DeactivateIncidentTypeRequest) returns (DeactivateIncidentTypeResponse) {
    option (google.api.http) = {post: "/v1/incident-types/{type_id}/deactivations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_not_found\",\"message\":\"Type not found.\"}"
          }
        }
      }
    };
  }
  rpc ReactivateIncidentType(ReactivateIncidentTypeRequest) returns (ReactivateIncidentTypeResponse) {
    option (google.api.http) = {post: "/v1/incident-types/{type_id}/reactivations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_not_found\",\"message\":\"Type not found.\"}"
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Conflict. Error codes:\n- `incident_type_reactivate_name_conflict` — reactivation would create a name conflict with an active type."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_reactivate_name_conflict\",\"message\":\"Name conflict on reactivation.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Validation failed or precondition not met. Error codes:\n- `incident_type_reactivate_inactive_ancestor` — the parent category is inactive and must be reactivated first."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_reactivate_inactive_ancestor\",\"message\":\"Parent category is inactive.\"}"
          }
        }
      }
    };
  }
  rpc DeleteIncidentType(DeleteIncidentTypeRequest) returns (DeleteIncidentTypeResponse) {
    option (google.api.http) = {delete: "/v1/incident-types/{type_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_not_found\",\"message\":\"Type not found.\"}"
          }
        }
      }
    };
  }
  rpc AllowIncidentTypeForPatients(AllowIncidentTypeForPatientsRequest) returns (AllowIncidentTypeForPatientsResponse) {
    option (google.api.http) = {post: "/v1/incident-types/{type_id}/patient-allowances"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_not_found\",\"message\":\"Type not found.\"}"
          }
        }
      }
    };
  }
  rpc DisallowIncidentTypeForPatients(DisallowIncidentTypeForPatientsRequest) returns (DisallowIncidentTypeForPatientsResponse) {
    option (google.api.http) = {delete: "/v1/incident-types/{type_id}/patient-allowances"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `incident_type_not_found` — type with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"incident_type_not_found\",\"message\":\"Type not found.\"}"
          }
        }
      }
    };
  }
}

// ---- Category messages ----

message CreateIncidentCategoryRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string parent_category_id = 2;
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  optional string description = 4;
}
message CreateIncidentCategoryResponse {
  string category_id = 1;
}

message UpdateIncidentCategoryDetailsRequest {
  string category_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message UpdateIncidentCategoryDetailsResponse {}

message MoveIncidentCategoryRequest {
  string category_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string new_parent_category_id = 2;
}
message MoveIncidentCategoryResponse {}

message DeactivateIncidentCategoryRequest {
  string category_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeactivateIncidentCategoryResponse {}

message ReactivateIncidentCategoryRequest {
  string category_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ReactivateIncidentCategoryResponse {}

message DeleteIncidentCategoryRequest {
  string category_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeleteIncidentCategoryResponse {}

// ---- Type messages ----

message CreateIncidentTypeRequest {
  string category_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message CreateIncidentTypeResponse {
  string type_id = 1;
}

message UpdateIncidentTypeDetailsRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string description = 3;
}
message UpdateIncidentTypeDetailsResponse {}

message MoveIncidentTypeRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
  string new_category_id = 2 [(google.api.field_behavior) = REQUIRED];
}
message MoveIncidentTypeResponse {}

message DeactivateIncidentTypeRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeactivateIncidentTypeResponse {}

message ReactivateIncidentTypeRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ReactivateIncidentTypeResponse {}

message DeleteIncidentTypeRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DeleteIncidentTypeResponse {}

message AllowIncidentTypeForPatientsRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message AllowIncidentTypeForPatientsResponse {}

message DisallowIncidentTypeForPatientsRequest {
  string type_id = 1 [(google.api.field_behavior) = REQUIRED];
}
message DisallowIncidentTypeForPatientsResponse {}
