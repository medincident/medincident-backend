syntax = "proto3";

package command.membership.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"validation_failed\",\"message\":\"Validation failed.\",\"details\":{\"violations\":[{\"field\":\"field_name\",\"rule\":\"required\",\"message\":\"field is required\"}]}}"
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unauthenticated\",\"message\":\"unauthenticated\"}"
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"permission_denied\",\"message\":\"permission denied\"}"
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unexpected_error\",\"message\":\"internal error\"}"
      }
    }
  }
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response (e.g. deadline exceeded or request canceled)."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"deadline_exceeded\",\"message\":\"deadline exceeded\"}"
      }
    }
  }
};

// MembershipService is the command-side contract for who-works-where
// data. It covers the Employee lifecycle (hire / update / terminate),
// Vacation lifecycle (start / schedule / end / cancel / change),
// role grants with deputy management for DepartmentResponsible,
// ClinicHead, OrganizationAdmin, OrganizationHead, and
// OrganizationDispatcher, plus the global SystemAdmin grant that
// operates directly on Zitadel user identifiers.
service MembershipCommandService {
  // Employee lifecycle
  rpc HireEmployee(HireEmployeeRequest) returns (HireEmployeeResponse) {
    option (google.api.http) = {
      post: "/v1/employees"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `zitadel_user_not_found` — Zitadel user with the given ID does not exist.\n- `department_not_found` — department with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"department_not_found\",\"message\":\"Department not found.\"}"
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "Conflict. Error codes:\n- `employee_already_hired` — this Zitadel user is already an active employee of this organization."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"employee_already_hired\",\"message\":\"Employee already hired.\"}"
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "Service unavailable. Error codes:\n- `zitadel_verify_failed` — Zitadel identity service is temporarily unavailable."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"zitadel_verify_failed\",\"message\":\"Identity service unavailable.\"}"
          }
        }
      }
    };
  }
  rpc UpdateEmployeePosition(UpdateEmployeePositionRequest) returns (UpdateEmployeePositionResponse) {
    option (google.api.http) = {
      put: "/v1/employees/{employee_id}/position"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `employee_not_found` — employee with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"employee_not_found\",\"message\":\"Employee not found.\"}"
          }
        }
      }
    };
  }
  rpc UpdateEmployeeDepartment(UpdateEmployeeDepartmentRequest) returns (UpdateEmployeeDepartmentResponse) {
