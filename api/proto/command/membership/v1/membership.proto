syntax = "proto3";

package command.membership.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
    }
  }
};

// MembershipService is the command-side contract for who-works-where
// data. It covers the Employee lifecycle (hire / update / terminate),
// Vacation lifecycle (start / schedule / end / cancel / change),
// role grants with deputy management for DepartmentResponsible,
// ClinicHead, OrganizationAdmin, OrganizationHead, and
// OrganizationDispatcher, plus the global SystemAdmin grant that
// operates directly on Zitadel user identifiers.
service MembershipCommandService {
  // Employee lifecycle
  rpc HireEmployee(HireEmployeeRequest) returns (HireEmployeeResponse) {
    option (google.api.http) = {
      post: "/v1/employees"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `zitadel_user_not_found` — Zitadel user with the given ID does not exist.\n- `department_not_found` — department with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `employee_already_hired` — this Zitadel user is already an active employee of this organization."}
      }
      responses: {
        key: "503"
        value: {description: "Service unavailable. Error codes:\n- `zitadel_verify_failed` — Zitadel identity service is temporarily unavailable."}
      }
    };
  }
  rpc UpdateEmployeePosition(UpdateEmployeePositionRequest) returns (UpdateEmployeePositionResponse) {
    option (google.api.http) = {
      put: "/v1/employees/{employee_id}/position"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `employee_not_found` — employee with the given ID does not exist."}
      }
    };
  }
  rpc UpdateEmployeeDepartment(UpdateEmployeeDepartmentRequest) returns (UpdateEmployeeDepartmentResponse) {
    option (google.api.http) = {
      put: "/v1/employees/{employee_id}/department"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `employee_not_found` — employee with the given ID does not exist.\n- `department_not_found` — department with the given ID does not exist."}
      }
    };
  }
  rpc TerminateEmployee(TerminateEmployeeRequest) returns (TerminateEmployeeResponse) {
    option (google.api.http) = {delete: "/v1/employees/{employee_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `employee_not_found` — employee with the given ID does not exist."}
      }
    };
  }
  rpc DeactivateEmployee(DeactivateEmployeeRequest) returns (DeactivateEmployeeResponse) {
    option (google.api.http) = {
      post: "/v1/employees/{employee_id}/deactivate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `employee_not_found` — employee with the given ID does not exist."}
      }
    };
  }
  rpc ActivateEmployee(ActivateEmployeeRequest) returns (ActivateEmployeeResponse) {
    option (google.api.http) = {
      post: "/v1/employees/{employee_id}/activate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `employee_not_found` — employee with the given ID does not exist."}
      }
      responses: {
        key: "422"
        value: {description: "Business rule violation. Error codes:\n- `employee_activate_parent_inactive` — parent department is inactive."}
      }
    };
  }

  // Vacation lifecycle
  rpc StartVacationNow(StartVacationNowRequest) returns (StartVacationNowResponse) {
    option (google.api.http) = {
      post: "/v1/employees/{employee_id}/vacations:start-now"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `employee_not_found` — employee with the given ID does not exist."}
      }
    };
  }
  rpc ScheduleVacation(ScheduleVacationRequest) returns (ScheduleVacationResponse) {
    option (google.api.http) = {
      post: "/v1/employees/{employee_id}/vacations"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `employee_not_found` — employee with the given ID does not exist."}
      }
    };
  }
  rpc UpdateVacationEndDate(UpdateVacationEndDateRequest) returns (UpdateVacationEndDateResponse) {
    option (google.api.http) = {
      put: "/v1/vacations/{vacation_id}/end-date"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `vacation_not_found` — vacation with the given ID does not exist."}
      }
    };
  }
  rpc ForceEndVacation(ForceEndVacationRequest) returns (ForceEndVacationResponse) {
    option (google.api.http) = {post: "/v1/vacations/{vacation_id}/terminations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `vacation_not_found` — vacation with the given ID does not exist."}
      }
    };
  }
  rpc CancelScheduledVacation(CancelScheduledVacationRequest) returns (CancelScheduledVacationResponse) {
    option (google.api.http) = {post: "/v1/vacations/{vacation_id}/cancellations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `vacation_not_found` — vacation with the given ID does not exist."}
      }
    };
  }

  // ------ DepartmentResponsible ------
  rpc AssignDepartmentResponsible(AssignDepartmentResponsibleRequest) returns (AssignDepartmentResponsibleResponse) {
    option (google.api.http) = {
      post: "/v1/departments/{department_id}/responsibles"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `department_not_found` — department with the given ID does not exist.\n- `employee_not_found` — employee with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `department_responsible_already_assigned` — this employee is already the department responsible."}
      }
    };
  }
  rpc RevokeDepartmentResponsible(RevokeDepartmentResponsibleRequest) returns (RevokeDepartmentResponsibleResponse) {
    option (google.api.http) = {delete: "/v1/departments/{department_id}/responsibles/{employee_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `department_responsible_not_found` — this employee is not the department responsible.\n- `employee_not_found` — employee with the given ID does not exist."}
      }
    };
  }
  rpc AssignDepartmentResponsibleDeputy(AssignDepartmentResponsibleDeputyRequest) returns (AssignDepartmentResponsibleDeputyResponse) {
    option (google.api.http) = {
      post: "/v1/departments/{department_id}/responsibles/{employee_id}/deputy"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `department_not_found` — department with the given ID does not exist.\n- `employee_not_found` — employee with the given ID does not exist.\n- `deputy_not_found` — deputy employee with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `deputy_already_assigned` — this employee is already a deputy for this role."}
      }
    };
  }
  rpc RemoveDepartmentResponsibleDeputy(RemoveDepartmentResponsibleDeputyRequest) returns (RemoveDepartmentResponsibleDeputyResponse) {
    option (google.api.http) = {delete: "/v1/departments/{department_id}/responsibles/{employee_id}/deputy"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `department_not_found` — department with the given ID does not exist."}
      }
    };
  }

  // ------ ClinicHead ------
  rpc AssignClinicHead(AssignClinicHeadRequest) returns (AssignClinicHeadResponse) {
    option (google.api.http) = {
      post: "/v1/clinics/{clinic_id}/heads"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `clinic_not_found` — clinic with the given ID does not exist.\n- `employee_not_found` — employee with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `clinic_head_already_assigned` — this clinic already has a head assigned."}
      }
    };
  }
  rpc RevokeClinicHead(RevokeClinicHeadRequest) returns (RevokeClinicHeadResponse) {
    option (google.api.http) = {delete: "/v1/clinics/{clinic_id}/heads/{employee_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `clinic_head_not_found` — this employee is not the clinic head."}
      }
    };
  }
  rpc AssignClinicHeadDeputy(AssignClinicHeadDeputyRequest) returns (AssignClinicHeadDeputyResponse) {
    option (google.api.http) = {
      post: "/v1/clinics/{clinic_id}/heads/{employee_id}/deputy"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `clinic_not_found` — clinic with the given ID does not exist.\n- `employee_not_found` — employee with the given ID does not exist.\n- `deputy_not_found` — deputy employee with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `deputy_already_assigned` — this employee is already a deputy for this role."}
      }
    };
  }
  rpc RemoveClinicHeadDeputy(RemoveClinicHeadDeputyRequest) returns (RemoveClinicHeadDeputyResponse) {
    option (google.api.http) = {delete: "/v1/clinics/{clinic_id}/heads/{employee_id}/deputy"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `clinic_not_found` — clinic with the given ID does not exist."}
      }
    };
  }

  // ------ OrganizationAdmin ------
  rpc AssignOrganizationAdmin(AssignOrganizationAdminRequest) returns (AssignOrganizationAdminResponse) {
    option (google.api.http) = {
      post: "/v1/organizations/{organization_id}/admins"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist.\n- `employee_not_found` — employee with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `organization_admin_already_assigned` — this employee is already an organization admin."}
      }
    };
  }
  rpc RevokeOrganizationAdmin(RevokeOrganizationAdminRequest) returns (RevokeOrganizationAdminResponse) {
    option (google.api.http) = {delete: "/v1/organizations/{organization_id}/admins/{employee_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_admin_not_found` — this employee is not an organization admin."}
      }
    };
  }
  rpc AssignOrganizationAdminDeputy(AssignOrganizationAdminDeputyRequest) returns (AssignOrganizationAdminDeputyResponse) {
    option (google.api.http) = {
      post: "/v1/organizations/{organization_id}/admins/{employee_id}/deputy"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist.\n- `employee_not_found` — employee with the given ID does not exist.\n- `deputy_not_found` — deputy employee with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `deputy_already_assigned` — this employee is already a deputy for this role."}
      }
    };
  }
  rpc RemoveOrganizationAdminDeputy(RemoveOrganizationAdminDeputyRequest) returns (RemoveOrganizationAdminDeputyResponse) {
    option (google.api.http) = {delete: "/v1/organizations/{organization_id}/admins/{employee_id}/deputy"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist."}
      }
    };
  }

  // ------ OrganizationHead ------
  rpc AssignOrganizationHead(AssignOrganizationHeadRequest) returns (AssignOrganizationHeadResponse) {
    option (google.api.http) = {
      post: "/v1/organizations/{organization_id}/heads"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist.\n- `employee_not_found` — employee with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `organization_head_already_assigned` — this organization already has a head assigned."}
      }
    };
  }
  rpc RevokeOrganizationHead(RevokeOrganizationHeadRequest) returns (RevokeOrganizationHeadResponse) {
    option (google.api.http) = {delete: "/v1/organizations/{organization_id}/heads/{employee_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_head_not_found` — this employee is not the organization head."}
      }
    };
  }
  rpc AssignOrganizationHeadDeputy(AssignOrganizationHeadDeputyRequest) returns (AssignOrganizationHeadDeputyResponse) {
    option (google.api.http) = {
      post: "/v1/organizations/{organization_id}/heads/{employee_id}/deputy"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist.\n- `employee_not_found` — employee with the given ID does not exist.\n- `deputy_not_found` — deputy employee with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `deputy_already_assigned` — this employee is already a deputy for this role."}
      }
    };
  }
  rpc RemoveOrganizationHeadDeputy(RemoveOrganizationHeadDeputyRequest) returns (RemoveOrganizationHeadDeputyResponse) {
    option (google.api.http) = {delete: "/v1/organizations/{organization_id}/heads/{employee_id}/deputy"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist."}
      }
    };
  }

  // ------ OrganizationDispatcher ------
  rpc AssignOrganizationDispatcher(AssignOrganizationDispatcherRequest) returns (AssignOrganizationDispatcherResponse) {
    option (google.api.http) = {
      post: "/v1/organizations/{organization_id}/dispatchers"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_not_found` — organization with the given ID does not exist.\n- `employee_not_found` — employee with the given ID does not exist."}
      }
      responses: {
        key: "409"
        value: {description: "Conflict. Error codes:\n- `organization_dispatcher_already_assigned` — this employee is already an organization dispatcher."}
      }
    };
  }
  rpc RevokeOrganizationDispatcher(RevokeOrganizationDispatcherRequest) returns (RevokeOrganizationDispatcherResponse) {
    option (google.api.http) = {delete: "/v1/organizations/{organization_id}/dispatchers/{employee_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {description: "Not found. Error codes:\n- `organization_dispatcher_not_found` — this employee is not an organization dispatcher."}
      }
    };
  }
  rpc AssignOrganizationDispatcherDeputy(AssignOrganizationDispatcherDeputyRequest) returns (AssignOrganizationDispatcherDeputyResponse) {
    option (google.api.http) = {
