syntax = "proto3";

package command.announcement.v1;

import "error/v1/error.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/medincident/medincident-backend/pkg/command/announcement/v1;announcementv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  responses: {
    key: "400"
    value: {
      description: "Validation failed or invalid input."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"validation_failed\",\"message\":\"Validation failed.\",\"details\":{\"violations\":[{\"field\":\"field_name\",\"rule\":\"required\",\"message\":\"field is required\"}]}}"
      }
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated — missing or invalid token."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unauthenticated\",\"message\":\"unauthenticated\"}"
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Permission denied."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"permission_denied\",\"message\":\"permission denied\"}"
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "Unexpected server error."
      schema: {
        json_schema: {ref: ".error.v1.ErrorResponse"}
      }
      examples: {
        key: "application/json"
        value: "{\"code\":\"unexpected_error\",\"message\":\"internal error\"}"
      }
    }
  }
};

// AnnouncementCommandService is the write-side contract for announcements.
service AnnouncementCommandService {
  rpc CreateAnnouncement(CreateAnnouncementRequest) returns (CreateAnnouncementResponse) {
    option (google.api.http) = {
      post: "/v1/announcements"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `announcement_organization_not_found` — organization with the given ID does not exist.\n- `announcement_clinic_not_found` — clinic with the given ID does not exist.\n- `announcement_department_not_found` — department with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"announcement_organization_not_found\",\"message\":\"Organization not found.\"}"
          }
        }
      }
    };
  }
  rpc UpdateAnnouncement(UpdateAnnouncementRequest) returns (UpdateAnnouncementResponse) {
    option (google.api.http) = {
      put: "/v1/announcements/{id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `announcement_not_found` — announcement with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"announcement_not_found\",\"message\":\"Announcement not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Failed precondition. Error codes:\n- `announcement_archived` — announcement is archived and cannot be modified."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"announcement_archived\",\"message\":\"Announcement is archived.\"}"
          }
        }
      }
    };
  }
  rpc UpdateAnnouncementPriority(UpdateAnnouncementPriorityRequest) returns (UpdateAnnouncementPriorityResponse) {
    option (google.api.http) = {
      put: "/v1/announcements/{id}/priority"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `announcement_not_found` — announcement with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"announcement_not_found\",\"message\":\"Announcement not found.\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "Failed precondition. Error codes:\n- `announcement_archived` — announcement is archived and cannot be modified."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"announcement_archived\",\"message\":\"Announcement is archived.\"}"
          }
        }
      }
    };
  }
  rpc ArchiveAnnouncement(ArchiveAnnouncementRequest) returns (ArchiveAnnouncementResponse) {
    option (google.api.http) = {post: "/v1/announcements/{id}:archive"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `announcement_not_found` — announcement with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"announcement_not_found\",\"message\":\"Announcement not found.\"}"
          }
        }
      }
    };
  }
  rpc UnarchiveAnnouncement(UnarchiveAnnouncementRequest) returns (UnarchiveAnnouncementResponse) {
    option (google.api.http) = {post: "/v1/announcements/{id}:unarchive"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "404"
        value: {
          description: "Not found. Error codes:\n- `announcement_not_found` — announcement with the given ID does not exist."
          schema: {
            json_schema: {ref: ".error.v1.ErrorResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":\"announcement_not_found\",\"message\":\"Announcement not found.\"}"
          }
        }
      }
    };
  }
}

enum AnnouncementPriority {
  ANNOUNCEMENT_PRIORITY_UNSPECIFIED = 0;
  ANNOUNCEMENT_PRIORITY_NORMAL = 1;
  ANNOUNCEMENT_PRIORITY_HIGH = 2;
}

message CreateAnnouncementRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string clinic_id = 2;
  optional string department_id = 3;
  string title = 4 [(google.api.field_behavior) = REQUIRED];
  string content = 5 [(google.api.field_behavior) = REQUIRED];
  AnnouncementPriority priority = 6 [(google.api.field_behavior) = REQUIRED];
  optional string starts_at = 7; // RFC3339Nano
  optional string ends_at = 8; // RFC3339Nano
}
message CreateAnnouncementResponse {
  string id = 1;
}

message UpdateAnnouncementRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string title = 2 [(google.api.field_behavior) = REQUIRED];
  string content = 3 [(google.api.field_behavior) = REQUIRED];
  optional string starts_at = 4; // RFC3339Nano; absent = clear
  optional string ends_at = 5; // RFC3339Nano; absent = clear
}
message UpdateAnnouncementResponse {}

message UpdateAnnouncementPriorityRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  AnnouncementPriority priority = 2 [(google.api.field_behavior) = REQUIRED];
}
message UpdateAnnouncementPriorityResponse {}

message ArchiveAnnouncementRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}
message ArchiveAnnouncementResponse {}

message UnarchiveAnnouncementRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}
message UnarchiveAnnouncementResponse {}
