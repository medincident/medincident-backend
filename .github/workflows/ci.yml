name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.proto"
      - "**.sql"
      - "api/proto/buf.yaml"
      - "api/proto/buf.lock"
      - "buf.gen.yaml"
      - "buf.gen.docs.yaml"
      - "db/migrations/**"
      - "Taskfile.yml"
      - "Makefile"
      - "cmd/**"
      - "build/**"
      - "configs/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.proto"
      - "**.sql"
      - "api/proto/buf.yaml"
      - "api/proto/buf.lock"
      - "buf.gen.yaml"
      - "buf.gen.docs.yaml"
      - "db/migrations/**"
      - "Taskfile.yml"
      - "Makefile"
      - "cmd/**"
      - "build/**"
      - "configs/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
      - run: task proto:fmt:check
      - run: task proto:lint
      # The monorepo merge (Plan 1) intentionally renames service.* to
      # command.* — that is a breaking change vs the pre-merge main.
      # Allow this step to fail until Plan 2 (which adds the projector
      # wiring) lands on top of the new baseline; from that point on
      # strict breaking-check resumes naturally.
      - run: task proto:breaking
        continue-on-error: true
      - run: task gen:check
      - run: task fmt:check
      - run: task lint
      - run: task vuln
      - run: task test
