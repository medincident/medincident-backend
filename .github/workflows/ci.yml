name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
      - run: task proto:fmt:check
      - run: task proto:lint
      # After Plans 1-3 of the monorepo CQRS merge landed on main, the
      # new proto tree (api/proto/{command,query}/...) is the baseline.
      # Every subsequent PR that touches proto must go through an
      # explicit migration — no more free breaking changes.
      - run: task proto:breaking
      - run: task gen:check
      - run: task fmt:check
      - run: task lint
      - run: task vuln
      - run: task test
