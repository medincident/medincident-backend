name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.proto"
      - "**.sql"
      - "api/proto/buf.yaml"
      - "api/proto/buf.lock"
      - "buf.gen.yaml"
      - "buf.gen.docs.yaml"
      - "db/migrations/**"
      - "Taskfile.yml"
      - "Makefile"
      - "cmd/**"
      - "build/**"
      - "configs/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.proto"
      - "**.sql"
      - "api/proto/buf.yaml"
      - "api/proto/buf.lock"
      - "buf.gen.yaml"
      - "buf.gen.docs.yaml"
      - "db/migrations/**"
      - "Taskfile.yml"
      - "Makefile"
      - "cmd/**"
      - "build/**"
      - "configs/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
      - run: task proto:fmt:check
      - run: task proto:lint
      # After Plans 1-3 of the monorepo CQRS merge landed on main, the
      # new proto tree (api/proto/{command,query}/...) is the baseline.
      # Every subsequent PR that touches proto must go through an
      # explicit migration — no more free breaking changes.
      - run: task proto:breaking
      - run: task gen:check
      - run: task fmt:check
      - run: task lint
      - run: task vuln
      - run: task test
