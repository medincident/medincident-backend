name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/medincident

jobs:
  # ── Gate: only proceed if CI succeeded on a tag push ───────────────────────
  gate:
    name: Verify CI passed
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

  # ── Cross-compile binaries ─────────────────────────────────────────────────
  binaries:
    name: Build binaries
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make build-all
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          retention-days: 1

  # ── Docker images ──────────────────────────────────────────────────────────
  images:
    name: Push ${{ matrix.image }}
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: command-server
            dockerfile: build/command-server.Dockerfile
          - image: query-server
            dockerfile: build/query-server.Dockerfile
          - image: gateway-server
            dockerfile: build/gateway-server.Dockerfile
          - image: migrate
            dockerfile: build/migrate.Dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.gate.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.gate.outputs.tag, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [gate, binaries, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          PRERELEASE_FLAG=""
          if echo "$TAG" | grep -q '-'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG
