name: Sync docs to Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: write

jobs:
  wiki:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flatten docs/ into Wiki page names
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wiki-sync
          mkdir -p .wiki-sync

          # Maps a relative path (from docs/) to a flat Wiki page name.
          # Rules:
          #   Root files (Home.md, _Sidebar.md) → kept as-is.
          #   architecture/* → Architecture-*.md
          #   services/*.md → Service-*.md
          #   services/incident/*.md → Service-Incident-*.md
          #   services/request/*.md  → Service-Request-*.md
          #   api/*.md → API-*.md
          wiki_name() {
            local rel="$1"
            case "$rel" in
              architecture/*)  echo "Architecture-${rel#architecture/}" ;;
              services/incident/*) echo "Service-Incident-${rel#services/incident/}" ;;
              services/request/*)  echo "Service-Request-${rel#services/request/}" ;;
              services/*)      echo "Service-${rel#services/}" ;;
              api/*)           echo "API-${rel#api/}" ;;
              *)               echo "$rel" ;;
            esac
          }

          while IFS= read -r -d '' file; do
            rel="${file#docs/}"
            page="$(wiki_name "$rel")"
            dest=".wiki-sync/${page}"
            if [ -e "$dest" ]; then
              echo "Duplicate wiki page for '$file' -> '$dest'" >&2
              exit 1
            fi
            cp "$file" "$dest"
          done < <(find docs -type f -name '*.md' -print0)

      - name: Push docs to Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: .wiki-sync/
          token: ${{ secrets.GITHUB_TOKEN }}
